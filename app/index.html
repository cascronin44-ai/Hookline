      <p class="eyebrow">Practice ¬∑ ${sc.key} ${sc.name}</p><h1 class="title" style="font-size:26px">One note per click</h1>
      <p class="lead" style="margin-bottom:12px">Play all ${notes.length} notes from the low ${sc.key} to the high ${sc.key}, in time with the click. Do it cleanly 5 times in a row.</p>
      <div class="scale-board" id="spBoard">${scaleSVG(sc, SP.idx, T.listening ? SP.idx : -1)}</div>
      <div class="sp-status">
        <div class="sp-next"><small>${T.listening ? 'Next note' : 'First note'}</small><b id="spNext">${noteName(notes[SP.idx] ? notes[SP.idx].midi : sc.root, sc.flats)} ¬∑ ${STRING_FULL[(notes[SP.idx] || notes[0]).s]} string, fret ${(notes[SP.idx] || notes[0]).fret}</b></div>
        <div class="sp-runs"><span id="spRuns">${[0, 1, 2, 3, 4].map(i => `<i class="${i < SP.runs ? 'on' : ''}"></i>`).join('')}</span><small id="spRunText">${SP.runs} of 5 clean runs in a row</small></div>
      </div>
      <p id="spMsg" class="sp-msg ${SP.msgKind}" aria-live="polite">${SP.msg || (practicedToday(sc.id) ? 'Points already earned for this scale today. Practice still builds skill.' : '')}</p>
      <div class="met">
        <div class="met-row"><span class="met-l">${ic('metronome', 18)} Tempo</span><button data-act="bpm" data-d="-5" aria-label="Slower">‚àí</button><b><span id="bpmVal">${SC.bpm}</span> <small>BPM</small></b><button data-act="bpm" data-d="5" aria-label="Faster">+</button></div>
        <input type="range" id="bpmRange" min="40" max="160" step="5" value="${SC.bpm}" aria-label="Tempo in beats per minute">
        <div class="met-row"><span class="met-l">Click sound</span><button class="switch" id="clickSw" role="switch" aria-checked="${SC.click}" aria-label="Metronome click"></button></div>
      </div>
      ${T.error ? `<p class="status bad" style="margin:0 0 8px">${esc(T.error)}</p>` : ''}
      ${T.listening ? `<div class="tu-live"><span class="pill"><i class="dot"></i>${T.listening === 'sim' ? 'Test signal' : 'Listening'}</span><button class="text-btn" data-act="spstop">${ic('stop', 14)} Stop</button></div>` : ''}
      <details class="dev"><summary>Test without a guitar <span class="note" style="margin:0">(plays the scale 5 times)</span></summary><div class="dev-grid">
        <button data-act="spsim" data-v="clean">Play it steady</button><button data-act="spsim" data-v="uneven">Play it unevenly</button><button data-act="spsim" data-v="wrong">Hit a wrong note</button></div></details>`; },
    foot: () => T.listening ? '' : `<button class="btn btn-primary" data-act="splisten">${ic('mic', 20)}${SP.done ? 'Practice again' : 'Start with the click'}</button>`,
    mount: () => {
      const r = document.getElementById('bpmRange'), sw = document.getElementById('clickSw');
      if (r) r.addEventListener('input', () => { SC.bpm = +r.value; setText('bpmVal', String(SC.bpm)); });
      if (sw) sw.addEventListener('click', () => { SC.click = !SC.click; sw.setAttribute('aria-checked', SC.click); if (T.listening) { SC.click ? metStart() : metStop(); } });
    },
    leave: () => { cancelAnimationFrame(SP.raf); metStop(); tunerOff(); }
  };

  const SCALE_ACTIONS = {
    openscale: a => { SC.id = a.dataset.id; view = 'scale'; render(1); },
    hearscale: () => playScale(scaleById(SC.id)),
    practicescale: () => { SP.runs = 0; SP.done = false; spReset('', ''); view = 'scalepractice'; render(1); },
    splisten: () => spListen('mic'),
    spsim: a => spListen('sim', a.dataset.v),
    spstop: () => { cancelAnimationFrame(SP.raf); metStop(); tunerOff(); render(0); },
    bpm: a => { SC.bpm = Math.max(40, Math.min(160, SC.bpm + +a.dataset.d)); setText('bpmVal', String(SC.bpm)); const r = document.getElementById('bpmRange'); if (r) r.value = SC.bpm; }
  };

  /* ---------- Tabs (Phase 5) ---------- */
  const SI = { E: 0, A: 1, D: 2, G: 3, B: 4, e: 5 };
  const TAB_ROWS = ['e', 'B', 'G', 'D', 'A', 'E'];   // top line to bottom line
  // "e0 B3 | hG2" -> columns. A leading h, p, /, \ or b marks the technique used to reach that note.
  function parseTab(str) {
    return str.trim().split(/\s+/).map(tok => {
      if (tok === '|') return { bar: true };
      let tech = null; if ('hp/\\b'.includes(tok[0]) && tok.length > 2) { tech = tok[0]; tok = tok.slice(1); }
      return { notes: [{ s: SI[tok[0]], fret: +tok.slice(1) }], tech };
    });
  }
  const colMidi = c => STD[c.notes[0].s] + c.notes[0].fret;
  const playable = cols => cols.filter(c => !c.bar);

  function tabSVG(cols, o = {}) {   // o.cur = index of the playable column to highlight, o.done = how many are finished
    const W = 36, x0 = 36, width = Math.max(220, x0 + cols.length * W + 14), y = row => 16 + row * 18;
    let s = `<svg class="tab-svg" viewBox="0 0 ${width} 124" width="${width}" height="124" role="img" aria-label="Guitar tab">`;
    TAB_ROWS.forEach((r, i) => { s += `<text x="12" y="${y(i) + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)" font-family="ui-monospace, Menlo, monospace">${r}</text><line x1="24" y1="${y(i)}" x2="${width - 6}" y2="${y(i)}" stroke="var(--text)" stroke-opacity=".35" stroke-width="1.2"/>`; });
    s += `<line x1="24" y1="${y(0)}" x2="24" y2="${y(5)}" stroke="var(--text)" stroke-opacity=".5" stroke-width="2"/>`;
    let p = -1;
    cols.forEach((c, k) => {
      const x = x0 + k * W + W / 2;
      if (c.bar) { s += `<line x1="${x}" y1="${y(0)}" x2="${x}" y2="${y(5)}" stroke="var(--text)" stroke-opacity=".4" stroke-width="1.5"/>`; return; }
      p++;
      const isCur = p === o.cur, isDone = o.done !== undefined && p < o.done;
      if (isCur) s += `<rect x="${x - 15}" y="4" width="30" height="${y(5) + 8}" rx="8" fill="rgba(233,176,75,.22)" stroke="var(--accent)" stroke-width="1.5" class="tab-cur"/>`;
      c.notes.forEach(n => {
        const row = 5 - n.s, label = n.label !== undefined ? n.label : String(n.fret), w = 8 + label.length * 7.5;
        s += `<rect x="${x - w / 2}" y="${y(row) - 9}" width="${w}" height="18" rx="4" fill="${isCur ? 'var(--accent)' : 'var(--surface-solid)'}"/>`;
        s += `<text x="${x}" y="${y(row) + 5}" text-anchor="middle" font-size="14" font-weight="800" font-family="ui-monospace, Menlo, monospace" fill="${isCur ? 'var(--on-accent)' : isDone ? 'var(--good)' : 'var(--text)'}">${esc(label)}</text>`;
      });
      if (c.tech) { const row = 5 - c.notes[0].s; s += `<text x="${x - W / 2}" y="${y(row) - 7}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--accent)" font-family="ui-monospace, Menlo, monospace">${esc(c.tech)}</text>`; }
    });
    return s + '</svg>';
  }
  const tabBox = (cols, o) => `<div class="tab-box"${o && o.id ? ` id="${o.id}"` : ''}>${tabSVG(cols, o)}</div>`;
  const notePlace = c => { const n = c.notes[0]; return `${STRING_FULL[n.s]} string, ${n.fret ? `fret ${n.fret}` : 'open'}`; };

  const TAB_EX = [
    { id: 'open', name: 'Open strings', level: 'Easy', tab: 'E0 A0 D0 G0 B0 e0', tip: 'Pick each open string once, from the thickest to the thinnest. No fingers needed.' },
    { id: 'frets', name: 'First frets on the high e', level: 'Easy', tab: 'e0 e1 e3 e1 e0 | e0 e1 e3 e5 e3 e1 e0', tip: 'Use finger 1 for fret 1, finger 3 for fret 3 and finger 4 for fret 5.' },
    { id: 'mary', name: 'Mary Had a Little Lamb', level: 'Easy', tab: 'e0 B3 B1 B3 e0 e0 e0 | B3 B3 B3 | e0 e3 e3 | e0 B3 B1 B3 e0 e0 e0 | e0 B3 B3 e0 B3 B1', tip: 'A traditional song on the top two strings. Repeated numbers mean pick the same note again.' },
    { id: 'twinkle', name: 'Twinkle Twinkle Little Star', level: 'Easy', tab: 'B1 B1 e3 e3 e5 e5 e3 | e1 e1 e0 e0 B3 B3 B1', tip: 'A traditional melody. Keep your hand near the first frets.' },
    { id: 'ode', name: 'Ode to Joy', level: 'Medium', tab: 'e0 e0 e1 e3 e3 e1 e0 B3 | B1 B1 B3 e0 e0 B3 B3 | e0 e0 e1 e3 e3 e1 e0 B3 | B1 B1 B3 e0 B3 B1 B1', tip: "Beethoven's melody, crossing between the B and high e strings." },
    { id: 'saints', name: 'When the Saints Go Marching In', level: 'Medium', tab: 'B1 e0 e1 e3 | B1 e0 e1 e3 | B1 e0 e1 e3 e0 B1 e0 B3', tip: 'A traditional song. Hold the last note of each line a little longer.' },
    { id: 'riff', name: 'Low string riff', level: 'Medium', tab: 'E0 E0 E3 E5 A0 A2 A3 A2 | E0 E0 E3 E5 E3 E0', tip: 'A rock-style riff on the two thickest strings. Use fingers 1, 3 and 4.' },
    { id: 'legato', name: 'Hammer-ons and pull-offs', level: 'Hard', tab: 'G0 hG2 pG0 D0 hD2 pD0 | G0 hG2 hG4 pG2 pG0', tip: 'Pick only the first note of each group. Hammer (h) your finger down or pull it off (p) to sound the rest.' }
  ].map(x => Object.assign(x, { cols: parseTab(x.tab) }));
  const TBS = () => profile.tabs;

  /* lesson: how to read tabs */
  const C_CHORD = [{ notes: [{ s: 1, fret: 3 }, { s: 2, fret: 2 }, { s: 3, fret: 0 }, { s: 4, fret: 1 }, { s: 5, fret: 0 }] }];
  const G_CHORD = [{ notes: [{ s: 0, fret: 3 }, { s: 1, fret: 2 }, { s: 2, fret: 0 }, { s: 3, fret: 0 }, { s: 4, fret: 0 }, { s: 5, fret: 3 }] }];
  const TAB_LESSON = [
    { t: 'Six lines, six strings', body: 'Each line is one string. <b>The top line is the thinnest string (high e)</b> and the bottom line is the thickest (low E). That\'s the opposite of what you see looking down at your guitar, so take a second to flip it in your head.',
      ex: () => tabBox(parseTab('e0 | E0')), cap: 'Top line: high e. Bottom line: low E.',
      q: 'Which string is the bottom line?', opts: ['Low E (thickest)', 'High e (thinnest)', 'G string'], a: 0 },
    { t: 'Numbers are frets', body: 'A number tells you <b>which fret to press</b> on that string. <b>0 means play the string open</b>, with no finger on it.',
      ex: () => tabBox(parseTab('B3 G0 D2')), cap: 'B string fret 3, then G string open, then D string fret 2.',
      q: 'There\'s a 2 on the G line. What do you play?', opts: ['G string, fret 2', 'The 2nd string', 'Two strings at once'], a: 0 },
    { t: 'Read left to right', body: 'Tabs are read <b>from left to right, like a sentence</b>. Play each number in order. Vertical bar lines split the music into short sections.',
      ex: () => tabBox(parseTab('e0 e1 e3 | e1 e0')), cap: 'Play high e open, fret 1, fret 3, then back down.',
      q: 'In the tab above, which note do you play first?', opts: ['High e, open', 'High e, fret 3', 'All of them together'], a: 0 },
    { t: 'Stacked numbers are chords', body: 'Numbers <b>stacked in the same column are played together</b>, usually as one strum. Strings with no number aren\'t played.',
      ex: () => tabBox(C_CHORD.concat([{ bar: true }], G_CHORD)), cap: 'A C chord, then a G chord. The low E has no number in the C chord, so skip it.',
      q: 'Numbers stacked in one column mean‚Ä¶', opts: ['Play them together', 'Play them top to bottom, one at a time', 'Skip them'], a: 0 },
    { t: 'Symbols', body: 'Letters and marks between numbers tell you <b>how</b> to play a note:',
      ex: () => `<div class="sym-list">${[
        ['h', 'Hammer-on', 'Pick the first note, then press a finger down hard on the second without picking.', 'G5 hG7'],
        ['p', 'Pull-off', 'Pick the higher note, then flick that finger off to sound the lower one.', 'G7 pG5'],
        ['/', 'Slide up', 'Pick the note, then slide the same finger up to the next fret number.', 'G5 /G7'],
        ['\\', 'Slide down', 'Pick the note, then slide the same finger down.', 'G7 \\G5'],
        ['b', 'Bend', 'Push the string sideways until it sounds like the higher fret in the label.', null],
        ['x', 'Muted', 'Rest your fingers lightly on the string and pick it for a "chk" sound.', null]
      ].map(([sym, name, desc, tab]) => `<div class="sym"><span class="sym-k">${esc(sym)}</span><div><b>${name}</b><span>${desc}</span></div>${tab ? tabBox(parseTab(tab)) : sym === 'b' ? tabBox([{ notes: [{ s: 3, fret: 7, label: '7b9' }] }]) : tabBox([{ notes: [{ s: 3, fret: 0, label: 'x' }, { s: 2, fret: 0, label: 'x' }] }])}</div>`).join('')}</div>`, cap: '',
      q: 'What does 5h7 mean?', opts: ['Pick fret 5, then hammer onto fret 7', 'Play frets 5 and 7 together', 'Slide from 5 to 7'], a: 0 }
  ];
  const TL = { answered: null };

  /* practice: play the tab note by note */
  const TP = { id: 'open', idx: 0, raf: 0, lastRun: 0, armed: true, floor: 1, peak: 0, onset: false, stable: { m: -1, n: 0 }, lastEval: -1, msg: '', kind: '', finished: false };
  function tpReset() { Object.assign(TP, { idx: 0, armed: true, floor: 1, peak: 0, onset: false, stable: { m: -1, n: 0 }, lastEval: -1, msg: '', kind: '', finished: false }); }
  function tpDraw() {
    const ex = findEx(TP.id), notes = playable(ex.cols), box = document.getElementById('tpTab');
    if (box) { box.innerHTML = tabSVG(ex.cols, { cur: TP.idx < notes.length ? TP.idx : -1, done: TP.idx }); const cur = box.querySelector('.tab-cur'); if (cur) { const x = +cur.getAttribute('x'); box.scrollLeft = Math.max(0, x - box.clientWidth / 2 + 15); } }
    const n = notes[TP.idx]; setText('tpNext', n ? `${noteName(colMidi(n))} ¬∑ ${notePlace(n)}${n.tech ? ` (${{ h: 'hammer-on', p: 'pull-off', '/': 'slide up', '\\': 'slide down', b: 'bend' }[n.tech]})` : ''}` : 'Done!');
    setText('tpCount', `${Math.min(TP.idx, notes.length)} of ${notes.length} notes`);
    const m = document.getElementById('tpMsg'); if (m) { m.textContent = TP.msg; m.className = 'sp-msg ' + TP.kind; }
  }
  function tpLoop(now) {
    TP.raf = requestAnimationFrame(tpLoop);
    if (now - TP.lastRun < 30 || !T.analyser) return; TP.lastRun = now;
    const ex = findEx(TP.id), notes = playable(ex.cols);
    if (TP.idx >= notes.length) return;
    T.analyser.getFloatTimeDomainData(T.buf);
    let rms = 0; for (let i = 0; i < 2048; i++) rms += T.buf[i] * T.buf[i]; rms = Math.sqrt(rms / 2048);
    // note onsets: the level jumps after having dropped
    if (TP.armed) { TP.floor = Math.min(TP.floor, rms); if (rms > 0.015 && rms > TP.floor * 1.8) { TP.armed = false; TP.onset = true; TP.peak = rms; TP.stable = { m: -1, n: 0 }; } }
    else { TP.peak = Math.max(TP.peak, rms); if (rms < TP.peak * 0.45) { TP.armed = true; TP.floor = rms; } }
    const f = detectPitch(T.buf, T.ctx.sampleRate); if (f < 55) return;
    const m = Math.round(69 + 12 * Math.log2(f / profile.a4));
    if (m === TP.stable.m) TP.stable.n++; else TP.stable = { m, n: 1 };
    if (TP.stable.n !== 2) return;
    const want = colMidi(notes[TP.idx]), changed = m !== TP.lastEval, fromOnset = TP.onset;
    if (!fromOnset && !changed) return;
    TP.onset = false; TP.lastEval = m;
    if (m === want || m === want + 12) {
      TP.idx++; TP.msg = ''; TP.kind = '';
      if (TP.idx >= notes.length) tpFinish(ex); else tpDraw();
    } else if (fromOnset) { TP.msg = `That was ${noteName(m)}. The tab says ${noteName(want)}: ${notePlace(notes[TP.idx])}.`; TP.kind = 'warn'; tpDraw(); }
  }
  function tpFinish(ex) {
    cancelAnimationFrame(TP.raf); tunerOff(); TP.finished = true;
    const first = !TBS().done.includes(ex.id) && !ex.test;
    if (first) { const pts = ex.drill ? EXTRA.finger : EXTRA['tab' + ex.level]; award(pts, `${ex.drill ? 'Finger exercise' : 'Played tab'}: ${ex.name}`, () => TBS().done.push(ex.id)); }
    TP.msg = `You played ${ex.name}${first ? '' : ' again'}!`; TP.kind = 'good'; render(0);
  }
  async function tpListen(source, variant) {
    T.error = ''; const keep = TP.idx; tpReset(); if (source === 'mic') TP.idx = keep;
    if (source === 'mic') { await tStart(); if (!T.listening) return; }
    else await tpSim(variant);
    cancelAnimationFrame(TP.raf); TP.raf = requestAnimationFrame(tpLoop); render(0);
  }
  async function tpSim(variant) {   // test signal: plays the tab, with hammer-ons and pull-offs changing pitch without a new pick
    await ensureCtx(); stopSource();
    const ex = findEx(TP.id), notes = playable(ex.cols), g = T.ctx.createGain(); g.gain.value = 0.5; g.connect(T.input);
    const step = 0.42, oscs = []; let t = T.ctx.currentTime + 0.3, osc = null, og = null;
    notes.forEach((c, i) => {
      const wrong = variant === 'wrong' && i === 2;
      if (c.tech && osc && !wrong) { osc.frequency.setValueAtTime(freqOf(colMidi(c)), t); t += step; return; }
      const pick = m => {
        if (osc) { og.gain.setValueAtTime(0.3, t - 0.08); og.gain.linearRampToValueAtTime(0, t - 0.03); osc.stop(t); }
        osc = T.ctx.createOscillator(); og = T.ctx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freqOf(m), t);
        og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(0.3, t + 0.01); osc.connect(og); og.connect(g); osc.start(t); oscs.push(osc); t += step;
      };
      if (wrong) pick(colMidi(c) + 2);   // a wrong note first, then the right one
      pick(colMidi(c));
    });
    if (osc) { og.gain.setValueAtTime(0.3, t); og.gain.linearRampToValueAtTime(0, t + 0.1); osc.stop(t + 0.15); }
    T.sim = { oscs }; T.src = g; T.listening = 'sim';
  }

  /* quiz: which string and fret? */
  const TQ = { qs: [], i: 0, correct: 0, answered: null };
  const posLabel = (s, f) => `${STRING_FULL[s]}, ${f ? `fret ${f}` : 'open'}`;
  function newTabQuiz() {
    const rnd = n => Math.floor(Math.random() * n), qs = [];
    while (qs.length < 6) {
      const s = rnd(6), f = rnd(6), key = s + '-' + f; if (qs.some(q => q.key === key)) continue;
      const opts = new Set([posLabel(s, f)]);
      while (opts.size < 4) { const ds = Math.random() < 0.5 ? s : rnd(6), df = ds === s ? (f + 1 + rnd(5)) % 6 : f; opts.add(posLabel(ds, df)); }
      qs.push({ key, cols: [{ notes: [{ s, fret: f }] }], q: 'Which string and fret does this tab show?', opts: [...opts].sort(() => Math.random() - 0.5), a: posLabel(s, f) });
    }
    [{ tab: 'D5 hD7', q: 'What does the "h" tell you to do?', a: 'Hammer onto fret 7 without picking again', w: ['Hold both notes together', 'Play fret 5 harder'] },
     { tab: 'G7 \\G5', q: 'How do you get from 7 to 5 here?', a: 'Slide your finger down from fret 7 to fret 5', w: ['Pick fret 5 on a new string', 'Bend the string'] },
     { tab: 'B5 pB3', q: 'What does the "p" mean?', a: 'Pull your finger off to sound fret 3', w: ['Pick both notes', 'Play fret 3 louder'] }]
      .sort(() => Math.random() - 0.5).slice(0, 2)
      .forEach(x => qs.push({ cols: parseTab(x.tab), q: x.q, opts: [x.a, ...x.w].sort(() => Math.random() - 0.5), a: x.a }));
    TQ.qs = qs.sort(() => Math.random() - 0.5); TQ.i = 0; TQ.correct = 0; TQ.answered = null;
  }

  STEPS.tabs = {
    bare: true,
    body: () => { const tb = TBS(), nDone = tb.done.filter(id => TAB_EX.some(x => x.id === id)).length;
      return `${backRow()}<p class="eyebrow">Tabs</p><h1 class="title">Learn to read tabs</h1>
      <p class="lead">Tabs (short for tablature) show you exactly where to put your fingers. Most songs online are written this way, so once you can read them you can learn almost anything.</p>
      ${tabBox(parseTab('e0 e1 e3 | B1 B3 | G0 G2'))}
      <div class="tab-hub">
        <button class="hub-row" data-act="tlesson"><span class="hub-ic">${ic('book', 22)}</span><span class="sr-t"><b>How to read tabs</b><small>5 short parts ¬∑ strings, frets, chords, symbols</small></span><span class="pstat${tb.learned ? '' : ' due'}">${tb.learned ? `${ic('check', 12)} Done` : `${tb.step}/5`}</span></button>
        <button class="hub-row" data-act="tquiz"><span class="hub-ic">${ic('star', 22)}</span><span class="sr-t"><b>Tab quiz</b><small>8 questions ¬∑ which string and fret?</small></span><span class="pstat">${tb.quizBest === null ? '' : `Best ${tb.quizBest}/8`}</span></button>
      </div>
      <p class="section-title">Practice tabs ¬∑ ${nDone} of ${TAB_EX.length} played</p>
      <div class="scale-list">${TAB_EX.map(x => `<button class="scale-row" data-act="tex" data-id="${x.id}"><span class="sr-key lvl-${x.level.toLowerCase()}">${x.level[0]}</span><span class="sr-t"><b>${x.name}</b><small>${x.level} ¬∑ ${playable(x.cols).length} notes</small></span>${tb.done.includes(x.id) ? `<span class="pstat">${ic('check', 12)} Played</span>` : `<span class="chev">${ic('arrow', 16)}</span>`}</button>`).join('')}</div>`; },
    foot: () => tabbar('')
  };

  STEPS.tablesson = {
    bare: true,
    body: () => { const i = Math.min(TBS().step, TAB_LESSON.length - 1), L5 = TAB_LESSON[i];
      return `<div class="lesson-top"><button class="icon-btn" data-act="go" data-view="tabs" aria-label="Back to tabs">${ic('back')}</button><div class="progress"><i style="width:${Math.round((i + (TL.answered === L5.a ? 1 : 0)) / TAB_LESSON.length * 100)}%"></i></div></div>
      <p class="eyebrow">How to read tabs ¬∑ ${i + 1} of ${TAB_LESSON.length}</p><h1 class="title">${L5.t}</h1>
      <p class="lead">${L5.body}</p>${L5.ex()}${L5.cap ? `<p class="note" style="text-align:center;margin:6px 0 0">${L5.cap}</p>` : ''}
      <div class="tl-check"><b>${L5.q}</b><div class="tl-opts">${[[1, 0, 2], [0, 2, 1], [2, 1, 0], [1, 2, 0], [2, 0, 1]][i].map(k => [L5.opts[k], k]).map(([o, k]) => { let cls = ''; if (TL.answered !== null) { if (k === L5.a && TL.answered === L5.a) cls = ' right'; else if (k === TL.answered) cls = ' wrong'; }
        return `<button class="qopt wide${cls}" data-act="tlans" data-k="${k}"${TL.answered === L5.a ? ' disabled' : ''}>${esc(o)}</button>`; }).join('')}</div>
        <p class="qfeed ${TL.answered === null ? '' : TL.answered === L5.a ? 'good' : 'warn'}">${TL.answered === null ? ' ' : TL.answered === L5.a ? 'Correct.' : 'Not quite, try again.'}</p></div>`; },
    foot: () => { const i = Math.min(TBS().step, TAB_LESSON.length - 1), ok = TL.answered === TAB_LESSON[i].a;

  };

  STEPS.tabplay = {
    bare: true,
    body: () => { const ex = findEx(TP.id), notes = playable(ex.cols), n = notes[Math.min(TP.idx, notes.length - 1)];
      return `<div class="row" style="margin-bottom:6px"><button class="icon-btn" data-act="go" data-view="${ex.drill ? 'practice' : 'tabs'}" aria-label="Back">${ic('back')}</button></div>

      ${T.listening ? `<div class="tu-live"><span class="pill"><i class="dot"></i>${T.listening === 'sim' ? 'Test signal' : 'Listening'}</span><button class="text-btn" data-act="tpstop">${ic('stop', 14)} Stop</button></div>` : ''}
      ${TP.finished ? '' : `<details class="dev"><summary>Test without a guitar</summary><div class="dev-grid"><button data-act="tpsim" data-v="clean">Play it correctly</button><button data-act="tpsim" data-v="wrong">Play a wrong note</button></div></details>`}`; },
    foot: () => { if (T.listening) return '';

      if (TP.finished) return `<div class="btn-row"><button class="btn btn-ghost" data-act="tpagain">${ic('refresh', 18)}Again</button>${next ? `<button class="btn btn-primary" data-act="tex" data-id="${next.id}">Next: ${next.name}</button>` : `<button class="btn btn-primary" data-act="go" data-view="${findEx(TP.id).drill ? 'practice' : 'tabs'}">Done</button>`}</div>`;
      return `<button class="btn btn-primary" data-act="tplisten">${ic('mic', 20)}${TP.idx ? 'Keep going' : 'Start playing'}</button>`; },
    mount: () => { const box = document.getElementById('tpTab'), cur = box && box.querySelector('.tab-cur'); if (cur) box.scrollLeft = Math.max(0, +cur.getAttribute('x') - box.clientWidth / 2 + 15); },
    leave: () => { cancelAnimationFrame(TP.raf); tunerOff(); }
  };

  STEPS.tabquiz = {
    bare: true,
    body: () => {
      if (TQ.i >= TQ.qs.length) return `<div class="row" style="margin-bottom:6px"><button class="icon-btn" data-act="go" data-view="tabs" aria-label="Back to tabs">${ic('back')}</button></div>

        <p class="lead">${TQ.correct === 8 ? 'Perfect. You can read tabs.' : TQ.correct >= 6 ? 'Nice work. Take it again any time to sharpen up.' : 'Worth another look at the lesson, then try again.'}</p></div>`;

        <p class="eyebrow">Tab quiz ¬∑ ${TQ.i + 1} of ${TQ.qs.length}</p><h1 class="title" style="font-size:26px">${q.q}</h1>
        ${tabBox(q.cols)}
        <div class="tl-opts" style="margin-top:14px">${q.opts.map(o => { let cls = ''; if (TQ.answered !== null) { if (o === q.a) cls = ' right'; else if (o === TQ.answered) cls = ' wrong'; }
          return `<button class="qopt wide${cls}" data-act="tqans" data-o="${esc(o)}"${TQ.answered !== null ? ' disabled' : ''}>${esc(o)}</button>`; }).join('')}</div>
        <p class="qfeed ${TQ.answered === null ? '' : TQ.answered === q.a ? 'good' : 'warn'}">${TQ.answered === null ? ' ' : TQ.answered === q.a ? 'Correct.' : `It's: ${esc(q.a)}.`}</p>`; },
    foot: () => TQ.i >= TQ.qs.length
      ? `<div class="btn-row"><button class="btn btn-ghost" data-act="tquiz">${ic('refresh', 18)}Retry</button><button class="btn btn-primary" data-act="go" data-view="tabs">Back to tabs</button></div>`
      : TQ.answered !== null ? `<button class="btn btn-primary" data-act="tqnext">${TQ.i === TQ.qs.length - 1 ? 'See my score' : 'Next question'}</button>` : ''
  };

  const TAB_ACTIONS = {
    tlesson: () => { if (TBS().learned) TBS().step = 0; TL.answered = null; view = 'tablesson'; render(1); },
    tlans: a => { TL.answered = +a.dataset.k; render(0); },
    tlnext: () => { const tb = TBS(); if (tb.step < TAB_LESSON.length - 1) { tb.step++; TL.answered = null; save(); render(1); } else { const first = !tb.learned; tb.learned = true; tb.step = TAB_LESSON.length; save(); view = 'tabs'; render(-1); if (first) award(EXTRA.tabLesson, 'Finished the tabs lesson'); else toast('Lesson complete.'); } },
    tlprev: () => { const tb = TBS(); tb.step = Math.max(0, Math.min(tb.step, TAB_LESSON.length - 1) - 1); TL.answered = TAB_LESSON[tb.step].a; save(); render(-1); },
    tex: a => { cancelAnimationFrame(TP.raf); tunerOff(); TP.id = a.dataset.id; tpReset(); T.error = ''; view = 'tabplay'; render(1); },
    tplisten: () => tpListen('mic'),
    tpsim: a => tpListen('sim', a.dataset.v),
    tpstop: () => { cancelAnimationFrame(TP.raf); tunerOff(); render(0); },
    tpagain: () => { tpReset(); render(0); },
    tquiz: () => { newTabQuiz(); view = 'tabquiz'; render(1); },
    tqans: a => { const q = TQ.qs[TQ.i]; TQ.answered = a.dataset.o; if (TQ.answered === q.a) TQ.correct++; render(0); },
    tqnext: () => { TQ.i++; TQ.answered = null; if (TQ.i >= TQ.qs.length) { const tb = TBS(), d = ensureDay(); tb.quizBest = Math.max(tb.quizBest || 0, TQ.correct); save(); if (TQ.correct === 8 && !d.tabquiz) { d.tabquiz = true; award(EXTRA.tabQuiz, 'Perfect tab quiz'); } } render(1); }
  };

  /* ---------- Practice (Phase 6) ---------- */
  const voiceOf = c => CH[c].map((f, i) => f === 'x' ? null : STD[i] + f).filter(m => m !== null);
  const DRILL_EX = [
    { id: 'spider', name: 'Spider walk up', level: 'Easy', tab: 'E1 E2 E3 E4 | A1 A2 A3 A4 | D1 D2 D3 D4 | G1 G2 G3 G4 | B1 B2 B3 B4 | e1 e2 e3 e4', tip: 'One finger per fret: index on 1, middle on 2, ring on 3, pinky on 4. Keep fingers close to the strings.' },
    { id: 'spiderdown', name: 'Spider walk down', level: 'Medium', tab: 'e4 e3 e2 e1 | B4 B3 B2 B1 | G4 G3 G2 G1 | D4 D3 D2 D1 | A4 A3 A2 A1 | E4 E3 E2 E1', tip: 'Start with all four fingers down on the high e, then lift one at a time.' },
    { id: 'stretch', name: 'Finger stretch 1-3-2-4', level: 'Hard', tab: 'E1 E3 E2 E4 | A1 A3 A2 A4 | D1 D3 D2 D4 | G1 G3 G2 G4 | B1 B3 B2 B4 | e1 e3 e2 e4', tip: 'Builds independence between fingers. Go slowly and keep each note clean.' }
  ].map(x => Object.assign(x, { cols: parseTab(x.tab), drill: true }));
  const findEx = id => TAB_EX.concat(DRILL_EX, TEST_EX).find(x => x.id === id) || TAB_EX[0];
  const exList = id => DRILL_EX.some(x => x.id === id) ? DRILL_EX : TAB_EX;

  const PAIRS = [['C', 'G'], ['G', 'D'], ['Em', 'C'], ['A', 'D'], ['E', 'A'], ['Am', 'C'], ['D', 'Em'], ['G', 'Em']];
  const PSONGS = [
    { id: 'ps-warm', name: 'Two-chord warm-up', prog: 'Em Em G G Em Em G G', bpm: 70, level: 'Easy' },
    { id: 'ps-camp', name: 'Campfire progression', prog: 'G G C C G G D D G', bpm: 80, level: 'Easy' },
    { id: 'ps-pop', name: 'Four-chord pop', prog: 'G D Em C G D Em C', bpm: 90, level: 'Medium' },
    { id: 'ps-blues', name: '12-bar blues in A', prog: 'A A A A D D A A E D A E', bpm: 100, level: 'Medium' },
    { id: 'ps-folk', name: 'Folk ballad', prog: 'C Am F G C Am F G C', bpm: 80, level: 'Hard' },
    { id: 'ps-rock', name: 'Rock anthem', prog: 'D A Bm G D A Bm G D', bpm: 110, level: 'Hard' }
  ].map(s => Object.assign(s, { bars: s.prog.split(' '), chords: [...new Set(s.prog.split(' '))] }));
  const songSteps = s => s.bars.reduce((acc, c) => { const last = acc[acc.length - 1]; if (last && last.c === c) last.bars++; else acc.push({ c, bars: 1 }); return acc; }, []);
  const STRUMS = [
    { id: 'down4', name: 'Four downstrokes', slots: 'D-D-D-D-', bpm: 70, tip: 'One down-strum on every click. The steadiest place to start.' },
    { id: 'eighths', name: 'Down-up eighths', slots: 'DUDUDUDU', bpm: 70, tip: 'Down on the click, up in between. Keep your arm moving like a pendulum, even on the rests later.' },
    { id: 'folk', name: 'Folk pattern', slots: 'D-DU-UDU', bpm: 75, tip: 'Down, down-up, up-down-up. Keep your hand moving on the gap, just miss the strings.' },
    { id: 'pop', name: 'Pop pattern', slots: 'D-D-UDU-', bpm: 80, tip: 'Down, down, up-down-up. Common in pop and rock songs.' }
  ];
  const PR = { pair: ['C', 'G'], dur: 30, raf: 0, lastRun: 0, count: 0, endAt: null, stable: { c: null, n: 0 }, last: null, finished: false, result: '',
    song: 'ps-warm', step: 0, streak: 0, songDone: false, strum: 'down4', t0: 0, onsets: [], armed: true, floor: 1, peak: 0, strumState: 'idle', strumResult: '', q: '' };
  const pairKey = p => p.join('-');
  function prStop() { cancelAnimationFrame(PR.raf); metStop(); tunerOff(); }

  async function simChords(seq, each) {   // test signal: strum chords in sequence, `each` seconds apiece
    await ensureCtx(); stopSource();
    const g = T.ctx.createGain(); g.gain.value = 0.5; g.connect(T.input); const oscs = []; let t = T.ctx.currentTime + 0.25;
    seq.forEach(c => { voiceOf(c).forEach((m, i) => { const o = T.ctx.createOscillator(), og = T.ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = freqOf(m) * Math.pow(2, (i % 2 ? 3 : -3) / 1200);
      og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(0.09, t + 0.02); og.gain.setValueAtTime(0.09, t + each - 0.15); og.gain.linearRampToValueAtTime(0, t + each - 0.05);
      o.connect(og); og.connect(g); o.start(t); o.stop(t + each); oscs.push(o); }); t += each; });
    T.sim = { oscs }; T.src = g; T.listening = 'sim';
  }

  /* chord changes */
  function pcLoop(now) {
    PR.raf = requestAnimationFrame(pcLoop);
    if (now - PR.lastRun < 80) return; PR.lastRun = now;
    if (PR.endAt !== null) { const left = Math.max(0, PR.endAt - T.ctx.currentTime); setText('pcTime', `${Math.ceil(left)}s`); const bar = document.getElementById('pcBar'); if (bar) bar.style.width = (left / PR.dur * 100) + '%'; if (left <= 0) return pcFinish(); }
    const r = detectChord(); const c = r && r.score > 0.68 && PR.pair.includes(r.name) ? r.name : null;
    if (c && c === PR.stable.c) PR.stable.n++; else PR.stable = { c, n: c ? 1 : 0 };
    if (PR.stable.n !== 3) return;
    if (PR.endAt === null) PR.endAt = T.ctx.currentTime + PR.dur;
    if (PR.last && c !== PR.last) { PR.count++; setText('pcCount', String(PR.count)); }
    PR.last = c; const next = PR.pair.find(x => x !== c);
    setText('pcNext', `Now switch to ${next}`);
    document.querySelectorAll('.pc-chord').forEach(el => el.classList.toggle('on', el.dataset.c === next));
  }
  function pcFinish() {
    prStop(); PR.finished = true;
    const perMin = Math.round(PR.count * 60 / PR.dur), key = pairKey(PR.pair), best = profile.practice.best[key] || 0;
    if (perMin > best) { profile.practice.best[key] = perMin; save(); }
    if (perMin >= 30 && !profile.practice.goals[key]) { profile.practice.goals[key] = true; save(); setTimeout(() => award(EXTRA.changes30, `30+ changes a minute: ${PR.pair.join(' ‚Üî ')}`), 50); }

    render(0);
  }
  async function pcStart(source) {
    T.error = ''; Object.assign(PR, { count: 0, endAt: null, stable: { c: null, n: 0 }, last: null, finished: false, result: '' });

    else { const seq = []; for (let i = 0; i < Math.ceil(PR.dur / 1.1) + 4; i++) seq.push(PR.pair[i % 2]); await simChords(seq, 1.1); }
    cancelAnimationFrame(PR.raf); PR.raf = requestAnimationFrame(pcLoop); render(0);
  }

  /* short songs: follow the chord chart */
  function psLoop(now) {
    PR.raf = requestAnimationFrame(psLoop);
    if (now - PR.lastRun < 85) return; PR.lastRun = now;
    const s = PSONGS.find(x => x.id === PR.song), steps = songSteps(s), want = steps[PR.step] && steps[PR.step].c; if (!want) return;
    const r = detectChord(), ok = r && r.name === want && r.score > 0.68;
    PR.streak = ok ? PR.streak + 1 : Math.max(0, PR.streak - 1);
    const heard = document.getElementById('psHeard'); if (heard) heard.textContent = r ? (ok ? `Hearing ${want}‚Ä¶` : `That sounds like ${r.name}. The chart says ${want}.`) : 'Listening‚Ä¶ strum the chord';
    if (PR.streak >= 5) { PR.streak = 0; PR.step++; if (PR.step >= steps.length) return psFinish(s); psDraw(); }
  }
  function psDraw() {
    const s = PSONGS.find(x => x.id === PR.song), steps = songSteps(s);
    document.querySelectorAll('.chart-step').forEach((el, i) => { el.classList.toggle('done', i < PR.step); el.classList.toggle('on', i === PR.step); });
    const cur = steps[PR.step]; const big = document.getElementById('psBig'); if (big && cur) big.innerHTML = `${chordSVG(CH[cur.c])}<b>${cur.c}</b>`;
    const on = document.querySelector('.chart-step.on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  function psFinish(s) {
    prStop(); PR.songDone = true; PR.earned = 0;
    if (!profile.songs.includes(s.id)) { PR.earned = songPoints(s); award(PR.earned, `Played ${s.name}`, () => profile.songs.push(s.id)); }
    render(0);
  }
  async function psStart(source) {
    T.error = ''; PR.step = 0; PR.streak = 0; PR.songDone = false;
    const s = PSONGS.find(x => x.id === PR.song);
    if (source === 'mic') { await tStart(); if (!T.listening) return; }
    else await simChords(songSteps(s).map(x => x.c), 1.3);
    if (source === 'mic') metStart(s.bpm);
    cancelAnimationFrame(PR.raf); PR.raf = requestAnimationFrame(psLoop); render(0);
  }

  /* strumming: 1 bar count-in, then 4 bars scored against the pattern */
  const strumById = id => STRUMS.find(x => x.id === id) || STRUMS[0];
  function strumTimes(p, t0) { const half = 30 / p.bpm, out = []; for (let b = 0; b < 4; b++) for (let k = 0; k < 8; k++) if (p.slots[k] !== '-') out.push({ t: t0 + (b * 8 + k) * half, dir: p.slots[k] }); return out; }
  async function strumSound(t, dir, dest, vol = 0.07) {
    voiceOf('G').forEach((m, i, arr) => { const o = T.ctx.createOscillator(), g = T.ctx.createGain(), st = t + (dir === 'U' ? arr.length - 1 - i : i) * 0.012;
      o.type = 'sawtooth'; o.frequency.value = freqOf(m); g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(vol, st + 0.005); g.gain.exponentialRampToValueAtTime(0.001, st + 0.28);
      o.connect(g); g.connect(dest); o.start(st); o.stop(st + 0.3); });
  }
  async function hearStrum() { await ensureCtx(); const p = strumById(PR.strum), t0 = T.ctx.currentTime + 0.1; strumTimes(p, t0).slice(0, p.slots.replace(/-/g, '').length * 2).forEach(x => strumSound(x.t, x.dir, T.ctx.destination, 0.05)); }
  function stLoop() {
    PR.raf = requestAnimationFrame(stLoop);
    const p = strumById(PR.strum), now = T.ctx.currentTime, half = 30 / p.bpm, pos = Math.floor((now - PR.t0) / half);
    const slots = document.querySelectorAll('.slot');
    slots.forEach((el, k) => el.classList.toggle('now', pos >= 0 && pos < 32 && pos % 8 === k));
    setText('stPhase', pos < 0 ? `Count-in: ${Math.min(4, Math.floor((now - (PR.t0 - 8 * half)) / (2 * half)) + 1)}‚Ä¶` : pos < 32 ? `Bar ${Math.floor(pos / 8) + 1} of 4` : 'Finishing‚Ä¶');
    T.analyser.getFloatTimeDomainData(T.buf);
    let rms = 0; for (let i = 0; i < 1024; i++) rms += T.buf[i] * T.buf[i]; rms = Math.sqrt(rms / 1024);
    if (PR.armed) { PR.floor = Math.min(PR.floor, rms); if (rms > 0.02 && rms > PR.floor * 2) { PR.armed = false; PR.peak = rms; PR.onsets.push(now - 0.02); } }
    else { PR.peak = Math.max(PR.peak, rms); if (rms < PR.peak * 0.5) { PR.armed = true; PR.floor = rms; } }
    if (now > PR.t0 + 32 * half + 0.3) stFinish(p);
  }
  function stFinish(p) {
    prStop();
    const exp = strumTimes(p, PR.t0), used = new Set(); let hits = 0;
    exp.forEach(e => { const k = PR.onsets.findIndex((o, i) => !used.has(i) && Math.abs(o - e.t) < 0.11); if (k >= 0) { used.add(k); hits++; } });
    const extra = PR.onsets.filter((o, i) => !used.has(i) && o > PR.t0 - 0.1).length, pct = Math.round(hits / exp.length * 100);
    PR.strumState = 'done';
    if (pct >= 90 && !profile.practice.strums[p.id]) { profile.practice.strums[p.id] = true; save(); setTimeout(() => award(EXTRA.strum90, `In time: ${p.name}`), 50); }
    PR.strumResult = `${hits} of ${exp.length} strums on time (${pct}%)${extra ? ` ¬∑ ${extra} extra` : ''}. ${pct >= 90 ? 'Locked in!' : pct >= 70 ? 'Close. Try again and keep your arm moving.' : 'Slow it down and count along out loud.'}`;
    render(0);
  }
  async function stStart(source, variant) {
    T.error = ''; Object.assign(PR, { onsets: [], armed: true, floor: 1, peak: 0, strumResult: '', strumState: 'running' });
    const p = strumById(PR.strum);
    if (source === 'mic') { await tStart(); if (!T.listening) { PR.strumState = 'idle'; return; } }
    else { await ensureCtx(); stopSource(); }
    metStart(p.bpm); PR.t0 = T.ctx.currentTime + 0.1 + 4 * (60 / p.bpm);
    if (source !== 'mic') {
      const g = T.ctx.createGain(); g.gain.value = 1; g.connect(T.input);
      strumTimes(p, PR.t0).forEach((x, i) => { if (variant === 'sloppy' && i % 4 === 3) return; strumSound(x.t + (variant === 'sloppy' && i % 3 === 1 ? 0.2 : 0), x.dir, g, 0.12); });
      T.sim = { oscs: [] }; T.src = g; T.listening = 'sim';
    }
    cancelAnimationFrame(PR.raf); PR.raf = requestAnimationFrame(stLoop); render(0);
  }

  /* search */
  const CHORD_TOKEN = t => { if (/^[a-g](m|7|5)?$/i.test(t) && !(t === 'a')) { const c = t[0].toUpperCase() + t.slice(1).toLowerCase(); return CH[c] ? c : null; } return null; };
  function searchPractice(q) {
    const raw = q.trim(); if (!raw) return '';
    const words = raw.split(/[^A-Za-z0-9#]+/).filter(Boolean), chords = [...new Set(words.map(CHORD_TOKEN).filter(Boolean))], low = raw.toLowerCase(), out = [];
    if (chords.length >= 2) chords.slice(0, 3).forEach((a, i, arr) => arr.slice(i + 1).forEach(b => out.push({ act: 'pcopen', data: `data-a="${a}" data-b="${b}"`, t: `Chord changes: ${a} ‚Üî ${b}`, s: 'Timed drill, built from your search' })));
    else if (chords.length === 1) { const c = chords[0]; PAIRS.filter(p => p.includes(c)).concat(PAIRS.some(p => p.includes(c)) ? [] : [[c, c === 'G' ? 'C' : 'G']]).slice(0, 3).forEach(p => out.push({ act: 'pcopen', data: `data-a="${p[0]}" data-b="${p[1]}"`, t: `Chord changes: ${p[0]} ‚Üî ${p[1]}`, s: `Practice switching to and from ${c}` }));
      PSONGS.filter(s => s.chords.includes(c)).forEach(s => out.push({ act: 'psopen', data: `data-id="${s.id}"`, t: s.name, s: `Short song using ${c} ¬∑ +${songPoints(s)} points` })); }
    const kw = [[/strum|rhythm|pattern|timing/, STRUMS.map(p => ({ act: 'stopen', data: `data-id="${p.id}"`, t: p.name, s: 'Strumming pattern' }))],

    for (let y = 0; y < H; y++) {
      const py = y * k, p = Math.floor(py / PH), v = py - p * PH, off = h2(p, 91) * BL, tint = (h2(p, 17) - 0.5) * 0.16, edgeY = Math.min(v, PH - v);
      for (let x = 0; x < W; x++) {
        const X = x * k, bpos = X + off, b = Math.floor(bpos / BL), sd = p * 7.31 + b * 3.17, bt = tint + (h2(p * 13 + b, 5) - 0.5) * 0.1;
        const warp = (vn(X * 0.002 + sd * 11, v * 0.011 + sd) - 0.5) * 64 + (vn(X * 0.009 + sd, v * 0.045 + 3) - 0.5) * 12;
        const g = v + warp + Math.sin(X * 0.0011 + sd) * 16;
        let band = 0.5 + 0.5 * Math.sin(g * 0.105 + (vn(X * 0.0035 + sd, g * 0.05) - 0.5) * 3); band *= band;
        const fiber = vn(X * 0.025 + sd * 5, g * 0.85), fine = vn(X * 0.08 + sd, g * 2.4), ribbon = (vn(X * 0.0055 + sd * 3, 0.5) - 0.5) * 0.28;
        let t = 0.5 * band + 0.32 * fiber + 0.18 * fine + ribbon + bt; t = t < 0 ? 0 : t > 1 ? 1 : t;
        let r, gg, bb;
        if (t < 0.5) { const f = t * 2; r = DARK[0] + (MID[0] - DARK[0]) * f; gg = DARK[1] + (MID[1] - DARK[1]) * f; bb = DARK[2] + (MID[2] - DARK[2]) * f; }
        else { const f = (t - 0.5) * 2; r = MID[0] + (LIGHT[0] - MID[0]) * f; gg = MID[1] + (LIGHT[1] - MID[1]) * f; bb = MID[2] + (LIGHT[2] - MID[2]) * f; }
        if (fine > 0.86 && h2(Math.floor(X * 0.5), Math.floor(g * 1.5)) > 0.6) { r *= 0.78; gg *= 0.75; bb *= 0.75; }
        const jp = bpos - b * BL, edgeX = Math.min(jp, BL - jp); let m = 1;
        if (edgeY < 1.3 || edgeX < 1.3) m = 0.32; else if (edgeY < 3 || edgeX < 2.5) m = 0.72; else if (v < 6) m = 1.07;
        px[i++] = r * m; px[i++] = gg * m; px[i++] = bb * m; px[i++] = 255;
      }
    }
    ctx.putImageData(img, 0, 0); cv.classList.add('ready');
  }
  let woodTimer;
  addEventListener('resize', () => { clearTimeout(woodTimer); woodTimer = setTimeout(() => { const [w, h] = woodSize; if (Math.abs(innerWidth - w) / w > 0.15 || Math.abs(innerHeight - h) / h > 0.25) drawWood(); }, 400); });

  render(1);
  setTimeout(drawWood, 20);
})();
</script>
