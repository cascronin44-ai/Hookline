      body: () => { const p = plan();
        return `<div class="home-head"><div class="hh-brand"><span class="brand-mark sm">${ic('pick', 18)}</span><span>Hookline</span></div><button class="avatar" data-act="go" data-view="goals" aria-label="Your goals and profile">${esc(firstName().charAt(0).toUpperCase() || 'H')}</button></div>
        <h1 class="title" style="margin-bottom:4px">Hey ${esc(firstName())}, ready to play?</h1>
        <p class="tagline"><b>The app meant to be deleted.</b> Learn guitar at your own pace, until you're ready to graduate.</p>
        ${rankCard()}
        ${pathCard()}
        <div class="tiles">${FEATURES.map(f => `<button class="tile" data-act="go" data-view="${f.id}"><span class="ti">${ic(f.icon, 26)}</span><span>${f.name}</span></button>`).join('')}</div>
        <p class="section-title">Today's points</p>
        <div class="tasks">${taskRow('Daily login', POINTS.login, ensureDay().login)}${taskRow('Daily lesson', POINTS.lesson, ensureDay().lesson)}${taskRow('Daily tune-up', POINTS.tune, ensureDay().tune)}${quizDue() ? `<button class="task" data-act="dailyquiz"><span class="tk"></span><span>Daily string quiz</span><span class="pts due">Due</span></button>` : ''}</div>
        <p class="section-title">Recent points</p>
        ${profile.log.length ? `<div class="activity">${profile.log.slice(0, 5).map(e => `<div class="act-row"><span>${esc(e.label)}</span><b>+${e.pts}</b></div>`).join('')}</div>` : '<p class="note" style="margin:0">Nothing yet.</p>'}
        ${devPanel()}`; },
      foot: () => tabbar('home'),
      mount: () => { const d = ensureDay(); if (!profile.days.includes(d.date)) { profile.days.push(d.date); save(); } if (!d.login) { d.login = true; save(); setTimeout(() => award(POINTS.login, 'Daily login'), 450); } }
    },
    ranks: {
      bare: true,
      body: () => { const r = rankInfo();
        return `<div class="row" style="margin-bottom:6px"><button class="icon-btn" data-act="home" aria-label="Back to home">${ic('back')}</button></div>
        <div class="rank-hero">${badgeSVG(r.cur.li, r.cur.tier, 'badge big')}<p class="eyebrow">Your rank</p><h1 class="title">${r.cur.label}</h1>
          <p class="lead" style="margin-bottom:10px">${fmt(profile.points)} points</p>
          <div class="rbar" style="--lvl:${r.cur.color}"><i style="width:${r.pct}%"></i></div>
          <p class="note${r.blocked ? ' need' : ''}" style="margin:6px 0 0">${r.blocked ? `You have the points for ${r.next.label}. ` : ''}${r.blocked ? `${LEVELS_R[r.next.li].name} needs ${gateMissing(r.next.li)}.` : nextText(r)}</p></div>
        <p class="section-title">All ranks</p>
        <div class="ladder">${LEVELS_R.map((L, li) => { const isCur = r.cur.li === li, locked = li > r.cur.li;
          return `<div class="lvl${isCur ? ' current' : ''}${locked ? ' locked' : ''}" style="--lvl:${L.c[0]}">${badgeSVG(li, isCur ? r.cur.tier : locked ? 1 : 3)}
            <div style="flex:1;min-width:0"><b>${L.name}${li === 6 ? ' <span class="note" style="margin:0">¬∑ final level</span>' : ''}</b>
            <div class="tiers">${THRESH[li].map((m, ti) => `<span class="${r.idx >= li * 3 + ti ? 'got' : ''}">${ROMAN[ti]} ¬∑ ${fmt(m)}</span>`).join('')}</div>
            ${GATES[li] ? `<div class="req">${gateMet(li) ? ic('check', 13) : ic('lock', 13)}<span>Also needs ${gateList(li).map(x => `<span class="${x.met ? 'met' : ''}">${x.label} (${x.have}/${x.need})</span>`).join(' and ')}</span></div>` : ''}</div></div>`; }).join('')}</div>
        <p class="section-title">How to earn points</p>
        <div class="earn">
          ${earnRow('Daily login', 'Once a day', '50')}
          ${earnRow('Daily lesson', 'Once a day', '50')}
          ${earnRow('Daily tune-up', 'Once a day', '5')}
          ${earnRow('Full scale', '5 times in a row at a steady speed ¬∑ each scale once a day', '50')}
          ${earnRow('Learn a basic chord', 'C, A, G, E, D, Em, Am or Dm', '25')}
          ${earnRow('Learn a sus, power, seventh, open or partial chord', 'Played cleanly and switched to smoothly', '45')}
          ${earnRow('Learn a barre chord', 'F, Bm and others', '60')}
          ${earnRow('Play a full song', 'Rated on number of chords, chord difficulty and speed', '25‚Äì200')}
        </div>
        <p class="section-title">More ways to earn</p>
        <div class="earn">
          ${earnRow('Finish Step 1', 'Once', String(EXTRA.step1))}
          ${earnRow('Finish the tabs lesson', 'Once', String(EXTRA.tabLesson))}
          ${earnRow('Play a practice tab', `First time ¬∑ Easy ${EXTRA.tabEasy}, Medium ${EXTRA.tabMedium}, Hard ${EXTRA.tabHard}`, `${EXTRA.tabEasy}‚Äì${EXTRA.tabHard}`)}
          ${earnRow('Perfect tab quiz', '8 of 8 ¬∑ once a day', String(EXTRA.tabQuiz))}
          ${earnRow('Finish a finger exercise', 'First time for each', String(EXTRA.finger))}
          ${earnRow('30+ chord changes a minute', 'Once for each chord pair', String(EXTRA.changes30))}
          ${earnRow('Strum a pattern 90% in time', 'Once for each pattern', String(EXTRA.strum90))}
        </div>
        <p class="section-title">Skill requirements</p>
        <div class="earn">
          ${Object.keys(GATES).map(li => earnRow(`${LEVELS_R[li].name}`, `Needs ${gateList(+li).map(x => x.label).join(' and ')}`, gateMet(+li) ? 'Met' : `${gateList(+li).filter(x => x.met).length}/${gateList(+li).length}`)).join('')}
        </div>
        <p class="note">Points keep adding up while a level is locked. As soon as you meet its skill requirements, you jump straight to the rank your points have earned.</p>
        <button class="hub-row" data-act="gradpreview" style="margin-top:14px"><span class="hub-ic">${ic('star', 22)}</span><span class="sr-t"><b>${profile.graduated ? 'Your graduation certificate' : 'What happens at Graduate III?'}</b><small>${profile.graduated ? 'You graduated from Hookline' : 'See the graduation screen'}</small></span><span class="chev">${ic('arrow', 16)}</span></button>`; },
      foot: () => tabbar('ranks')
    }
  };

  /* ---------- helpers ---------- */
  function firstName() { return (profile.name || '').trim().split(/\s+/)[0] || 'friend'; }
  function fmtTime(v) { const [h, m] = (v || '19:00').split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${ap}`; }
  function plan() {
    const known = profile.level === 'new' ? [] : profile.chords.slice();
    const next = CHORD_ORDER.find(c => !known.includes(c)) || 'F';
    const lesson = known.length < 2 ? 'Lesson 1: Your first two chords (Em and G)' : `Learn ${CHORD_NAMES[next]} and switch to it smoothly`;
    const path = []; let added = 0;
    for (const c of CHORD_ORDER) {
      if (known.includes(c) && path.filter(n => n.st === 'known').length < 2) path.push({ c, st: 'known' });
      else if (!known.includes(c) && added < 4) { path.push({ c, st: added === 0 ? 'next' : 'later' }); added++; }
      if (path.length >= 5) break;
    }
    const goalNames = profile.goals.map(g => (GOALS.find(x => x.v === g) || {}).t).filter(Boolean);
    return { next, lesson, path, goal: goalNames.join(', ') || 'Play songs I love' };
  }
  /* ---------- points & ranks ---------- */
  // 7 levels x 3 tiers. Tier I is the entry tier of each level. Thresholds are total points.
  const LEVELS_R = [
    { name: 'Ash',      c: ['#cfc8c1', '#6b635e'] },
    { name: 'Silver',   c: ['#f4f7fa', '#8e9aa8'] },
    { name: 'Gold',     c: ['#ffe28f', '#c38719'] },
    { name: 'Ruby',     c: ['#ff86a4', '#a3143e'] },
    { name: 'Emerald',  c: ['#86f2b6', '#15804a'] },
    { name: 'Diamond',  c: ['#dff8ff', '#3aa6d6'] },
    { name: 'Graduate', c: ['#f3e6ff', '#7d4ed4'] }
  ];
  const THRESH = [[0, 250, 600], [1000, 1600, 2300], [3200, 4300, 5600], [7200, 9000, 11000],
                  [13500, 16500, 20000], [24000, 29000, 35000], [42000, 50000, 60000]];
  const ROMAN = ['I', 'II', 'III'];
  const RANKS = [];
  LEVELS_R.forEach((L, li) => THRESH[li].forEach((min, ti) => RANKS.push({ li, tier: ti + 1, min, label: `${L.name} ${ROMAN[ti]}`, color: L.c[0], dark: L.c[1] })));
  // Skill requirements to enter a level (checked at its Tier I). Points keep counting while a level is locked.
  const GATES = { 2: { chords: 5 }, 4: { barre: 1, songs: 5 }, 6: { barre: 3, songs: 25 } };
  function skillCounts() {
    return { chords: profile.learned.length, barre: profile.learned.filter(c => BARRE_CHORDS.includes(c)).length, songs: profile.songs.length };
  }
  const GATE_WORDS = { chords: ['chord learned', 'chords learned'], barre: ['barre chord', 'barre chords'], songs: ['full song', 'full songs'] };
  function gateMet(li) { const g = GATES[li]; if (!g) return true; const have = skillCounts(); return Object.keys(g).every(k => have[k] >= g[k]); }
  function gateList(li) {   // [{label, have, need, met}]
    const g = GATES[li]; if (!g) return []; const have = skillCounts();
    return Object.keys(g).map(k => ({ label: `${g[k]} ${GATE_WORDS[k][g[k] === 1 ? 0 : 1]}`, have: Math.min(have[k], g[k]), need: g[k], met: have[k] >= g[k], k }));
  }
  function gateMissing(li) {
    return gateList(li).filter(x => !x.met).map(x => { const n = x.need - x.have; return `${n} more ${GATE_WORDS[x.k][n === 1 ? 0 : 1].replace(' learned', '')}`; }).join(' and ');
  }
  function rankInfo(pts = profile.points) {
    let i = 0;
    while (i + 1 < RANKS.length && RANKS[i + 1].min <= pts && (RANKS[i + 1].tier > 1 || gateMet(RANKS[i + 1].li))) i++;
    const cur = RANKS[i], next = RANKS[i + 1] || null;
    const blocked = !!next && pts >= next.min;   // enough points, but the next level's skills are missing
    return { cur, next, idx: i, blocked, pct: !next ? 100 : blocked ? 100 : Math.round(((pts - cur.min) / (next.min - cur.min)) * 100) };
  }
  function nextText(r) {
    if (!r.next) return 'Top rank reached';
    if (r.blocked) return `${LEVELS_R[r.next.li].name} needs ${gateMissing(r.next.li)}`;
    return `${fmt(r.next.min - profile.points)} to ${r.next.label}`;
  }
  const fmt = n => Number(n).toLocaleString('en-US');

  const POINTS = { login: 50, lesson: 50, tune: 5, scale: 50 };
  const BASIC_CHORDS = ['C', 'A', 'G', 'E', 'D', 'Em', 'Am', 'Dm'];
  const BARRE_CHORDS = ['F', 'Bm', 'B', 'Bb', 'F#m', 'C#m', 'G#m'];
  // basic 25 ¬∑ sus / power / seventh / open / partial 45 ¬∑ barre 60
  const chordPoints = c => BASIC_CHORDS.includes(c) ? 25 : BARRE_CHORDS.includes(c) ? 60 : 45;
  const chordKind = c => BASIC_CHORDS.includes(c) ? 'basic chord' : BARRE_CHORDS.includes(c) ? 'barre chord' : /sus/.test(c) ? 'sus chord' : /5$/.test(c) ? 'power chord' : /7/.test(c) ? 'seventh chord' : 'open chord';
  // Stand-in for the AI difficulty rating: chord difficulty, number of chords and tempo -> 25 to 200
  function songPoints(song) {
    const uniq = [...new Set(song.chords)];
    const diff = uniq.reduce((s, c) => s + (BASIC_CHORDS.includes(c) ? 1 : BARRE_CHORDS.includes(c) ? 3 : 1.8), 0);
    const speed = Math.min(1, Math.max(0, (song.bpm - 70) / 110));
    const raw = 25 + Math.max(0, diff - 2) * 14 + Math.max(0, uniq.length - 2) * 8 + speed * 50;
    return Math.min(200, Math.max(25, Math.round(raw / 5) * 5));
  }
  const DEV_CHORDS = ['C', 'A', 'G', 'E', 'D', 'Em', 'Am', 'Dm', 'Asus2', 'Dsus4', 'E5', 'A7', 'G7', 'B7', 'F', 'Bm'];
  const DEV_SONGS = [
    { id: 's-easy', name: 'Easy song', chords: ['Em', 'G'], bpm: 80 },
    { id: 's-mid', name: 'Medium song', chords: ['G', 'C', 'D', 'Em'], bpm: 110 },
    { id: 's-hard', name: 'Hard song', chords: ['F', 'Bm', 'G', 'D', 'A', 'E7'], bpm: 140 }
  ];
  const DEV_SCALES = [{ id: 'gmaj', name: 'G major scale' }, { id: 'ampent', name: 'A minor pentatonic' }];

  function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  function ensureDay() {
    const t = today();
    if (!profile.day || profile.day.date !== t) { profile.day = { date: t, login: false, lesson: false, tune: false, scales: [] }; save(); }
    return profile.day;
  }
  function award(pts, label, change) {
    const before = rankInfo().cur.label;
    if (change) change();   // e.g. add the learned chord, after the "before" rank is read
    profile.points += pts;
    profile.log.unshift({ t: Date.now(), pts, label }); if (profile.log.length > 30) profile.log.length = 30;
    save();
    const after = rankInfo().cur;
    if (after.label === 'Graduate III' && !profile.graduated) { profile.graduated = true; save(); GRAD.preview = false; view = 'graduation'; render(1); return; }
    if (current === 'home' || current === 'ranks') render(0);
    if (after.label !== before) showRankUp(after); else toast(`+${pts} points ¬∑ ${label}`);
  }

  let gid = 0;
  function badgeSVG(li, tier, cls = 'badge') {
    const L = LEVELS_R[li], id = 'bg' + (++gid);
    const glyph = li === 6
      ? '<path d="M15 29l17-8 17 8-17 8z" fill="rgba(0,0,0,.3)" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-linejoin="round"/><path d="M22 33v7c0 3 4.5 5 10 5s10-2 10-5v-7" fill="rgba(0,0,0,.2)" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>'
      : '<path d="M32 18c-8 0-13 3-13 8 0 7 6 14 13 21 7-7 13-14 13-21 0-5-5-8-13-8z" fill="rgba(0,0,0,.22)" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>';
    let pips = '';
    for (let i = 0; i < tier; i++) pips += `<circle cx="${32 + (i - (tier - 1) / 2) * 9}" cy="57" r="3.2" fill="#fff" stroke="rgba(0,0,0,.35)"/>`;
    return `<svg class="${cls}" viewBox="0 0 64 72" role="img" aria-label="${L.name} ${ROMAN[tier - 1]} badge"><defs><linearGradient id="${id}" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="${L.c[0]}"/><stop offset="1" stop-color="${L.c[1]}"/></linearGradient></defs>
      <path d="M32 2 60 12v24c0 18-13 29-28 34C17 65 4 54 4 36V12z" fill="url(#${id})" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/>
      <path d="M32 8 54 16v20c0 14-10 23-22 27C20 59 10 50 10 36V16z" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/>${glyph}${pips}</svg>`;
  }
  function showRankUp(r) {
    const el = document.createElement('div'); el.className = 'overlay';
    el.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Rank up">${badgeSVG(r.li, r.tier, 'badge big')}
      <p class="eyebrow">Rank up</p><h2 class="title">${r.label}</h2>
      <p class="lead">${rankInfo().next ? `Next up: ${rankInfo().next.label} at ${fmt(rankInfo().next.min)} points.` : "You've reached the top rank."}</p>
      <button class="btn btn-primary">Keep going</button></div>`;
    el.querySelector('button').addEventListener('click', () => el.remove());
    document.body.appendChild(el); el.querySelector('button').focus();
  }

  /* ---------- home areas (Phase 1 placeholders, filled in by later phases) ---------- */
  const FEATURES = [
    { id: 'tuner', name: 'Tuner', icon: 'tuner', phase: 2, title: 'Tuner',
      lead: 'A calibrated tuner that hears which string you are playing.',
      items: ['Detects each string on its own', 'Needle with a green in-tune zone', 'Alternate tunings button: Drop D, Open G, DADGAD and more', 'Custom tunings, string by string', `+${POINTS.tune} points for your daily tune-up`] },
    { id: 'scales', name: 'Scales', icon: 'scales', phase: 4, title: 'Scales',
      lead: 'Why scales matter, every main scale, and what each one does for your playing.',
      items: ['Beginner to advanced scales with fretboard diagrams', 'What each scale is for and where you hear it', 'Practice with a metronome while the mic checks your notes', `+${POINTS.scale} points for 5 clean runs in a row`] },
    { id: 'practice', name: 'Practice', icon: 'metronome', phase: 6, title: 'Practice',
      lead: 'Chord changes, short songs and drills that build real skill.',
      items: ['Timed chord changes like C to G and G to D', 'Short songs at your level', 'Strumming patterns and finger exercises', 'Search bar at the bottom to find or build your own drill'] },
    { id: 'tutorials', name: 'Tutorials', icon: 'video', phase: 6, title: 'Tutorial engine',
      lead: 'Search any song and get guitar tutorials and tabs for it.',
      items: ['Search bar for any song', '2‚Äì3 YouTube guitar tutorials for that song', 'A link to the song\'s guitar tabs', 'Links open outside the app'] },
    { id: 'tabs', name: 'Tabs', icon: 'tabs', phase: 5, title: 'Tabs',
      lead: 'Learn to read guitar tabs step by step, then practice them.',
      items: ['What the 6 lines and the numbers mean', 'Chords, hammer-ons, pull-offs, slides and bends', 'Practice tabs that get harder as you go', 'The mic checks the notes you play'] },
    { id: 'goals', name: 'Goals', icon: 'target', phase: 7, title: 'Goals',
      lead: 'Update your goals and retake the skills test to change your player level.',
      items: ['Change your goals, music taste and practice time', 'Change your daily reminder', 'Retake the skills test to move your level up or down'] }
  ];
  const PHASE_LABEL = { 2: 'Being built next', 4: 'Coming soon', 5: 'Coming soon', 6: 'Coming soon', 7: 'Coming soon' };
  const BASICS = ['C', 'A', 'G', 'E', 'D'];
  const basicsLearned = () => BASICS.filter(c => profile.learned.includes(c)).length;
  function pathCard() {
    const n = basicsLearned(), st = profile.step1, pct = st.done ? 100 : lessonProgress();
    return `<button class="path-card" data-act="go" data-view="path">
      <span class="pc-top"><span class="pill">${ic('path', 14)} Step 1 of your path</span><span class="note" style="margin:0">${n}/5 chords</span></span>
      <b>${st.done ? 'Step 1 complete' : 'Learn the basics'}</b>
      <span class="note" style="margin:2px 0 0">${st.done ? 'Step 2 is on the way. Keep practicing your five chords.' : `Strings, tuning and your first five chords: ${BASICS.join(', ')}`}</span>
      <span class="rbar" style="--lvl:${st.done ? 'var(--good)' : 'var(--accent)'}"><i style="width:${pct}%"></i></span>
      <span class="pc-cta">${st.done ? 'View' : st.stage === 'intro' ? 'Start' : 'Continue'} ${ic('arrow', 18)}</span></button>`;
  }
  const TABS = [{ id: 'home', label: 'Home', icon: 'home' }, { id: 'path', label: 'Path', icon: 'path' }, { id: 'tuner', label: 'Tuner', icon: 'tuner' }, { id: 'ranks', label: 'Rank', icon: 'rank' }];
  const tabbar = active => `<nav class="tabbar" aria-label="Main">${TABS.map(t => `<button class="tab${t.id === active ? ' on' : ''}" data-act="go" data-view="${t.id}"${t.id === active ? ' aria-current="page"' : ''}>${ic(t.icon, 22)}<span>${t.label}</span></button>`).join('')}</nav>`;
  const backRow = () => `<div class="row" style="margin-bottom:6px"><button class="icon-btn" data-act="go" data-view="home" aria-label="Back to home">${ic('back')}</button></div>`;

  FEATURES.forEach(f => {
    STEPS[f.id] = {
      bare: true,
      body: () => `${backRow()}
        <div class="feat-hero"><span class="feat-icon">${ic(f.icon, 40)}</span><p class="eyebrow">${PHASE_LABEL[f.phase]}</p><h1 class="title">${f.title}</h1><p class="lead">${f.lead}</p></div>
        <p class="section-title">What you'll find here</p>
        <ul class="feat-list">${f.items.map(x => `<li>${ic('check', 16)}<span>${esc(x)}</span></li>`).join('')}</ul>`,
      foot: () => tabbar(f.id === 'tuner' ? 'tuner' : '')
    };
  });

  /* ---------- Tuner (Phase 2) ---------- */
  const NOTE_SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const NOTE_FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  const noteName = (m, flats) => (flats ? NOTE_FLAT : NOTE_SHARP)[((m % 12) + 12) % 12];
  const noteOct = m => Math.floor(m / 12) - 1;
  const STRING_LABELS = ['6th', '5th', '4th', '3rd', '2nd', '1st'];   // thickest to thinnest
  const STD = [40, 45, 50, 55, 59, 64];                                  // E2 A2 D3 G3 B3 E4 (MIDI numbers)
  const PRESET_TUNINGS = [
    { id: 'standard', name: 'Standard', notes: STD },
    { id: 'dropd', name: 'Drop D', notes: [38, 45, 50, 55, 59, 64] },
    { id: 'halfdown', name: 'Half-step down', notes: [39, 44, 49, 54, 58, 63], flats: true },
    { id: 'openg', name: 'Open G', notes: [38, 43, 50, 55, 59, 62] },
    { id: 'opend', name: 'Open D', notes: [38, 45, 50, 54, 57, 62] },
    { id: 'dadgad', name: 'DADGAD', notes: [38, 45, 50, 55, 57, 62] }
  ];
  const allTunings = () => PRESET_TUNINGS.concat(profile.customTunings.map(t => Object.assign({ custom: true }, t)));
  const curTuning = () => allTunings().find(t => t.id === profile.tuningId) || PRESET_TUNINGS[0];
  const freqOf = m => profile.a4 * Math.pow(2, (m - 69) / 12);
  const IN_TUNE = 5;   // cents either side counts as in tune

  // YIN pitch detection: returns the fundamental frequency of the loudest note, or -1
  function detectPitch(buf, sr) {
    const tauMax = Math.ceil(sr / 60), tauMin = Math.floor(sr / 1000), W = Math.min(2048, buf.length - tauMax - 1);
    let rms = 0; for (let i = 0; i < W; i++) rms += buf[i] * buf[i]; rms = Math.sqrt(rms / W);
    if (rms < 0.008) return -1;
    const d = new Float32Array(tauMax + 1);
    for (let tau = 1; tau <= tauMax; tau++) { let s = 0; for (let j = 0; j < W; j++) { const v = buf[j] - buf[j + tau]; s += v * v; } d[tau] = s; }
    let run = 0; d[0] = 1;
    for (let tau = 1; tau <= tauMax; tau++) { run += d[tau]; d[tau] = run ? d[tau] * tau / run : 1; }
    let tau = -1;
    for (let t = tauMin; t <= tauMax; t++) { if (d[t] < 0.12) { while (t + 1 <= tauMax && d[t + 1] < d[t]) t++; tau = t; break; } }
    if (tau < 2) return -1;
    const x0 = d[tau - 1], x1 = d[tau], x2 = tau + 1 <= tauMax ? d[tau + 1] : d[tau];
    const a = (x0 + x2 - 2 * x1) / 2, b = (x2 - x0) / 2;
    return sr / (tau + (a ? -b / (2 * a) : 0));
  }
  const median = arr => { const s = arr.slice().sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };

  const T = { ctx: null, analyser: null, buf: null, src: null, stream: null, sim: null, raf: 0, listening: false,
    mode: 'auto', sel: 0, tuned: new Set(), hist: [], lastHeard: 0, lastRun: 0, target: 0, shown: 0, holdStr: -1, holdSince: 0, draft: null, error: '' };

  function tunerGauge() {
    const cx = 130, cy = 140, r = 110; let s = '<svg viewBox="0 0 260 160" class="tgauge" id="tGauge" aria-hidden="true">';
    const pt = (c, rad) => { const a = (-90 + c * 1.8) * Math.PI / 180; return [cx + rad * Math.cos(a), cy + rad * Math.sin(a)]; };
    const [a1, b1] = pt(-IN_TUNE, r + 9), [a2, b2] = pt(IN_TUNE, r + 9);
    s += `<path d="M${a1} ${b1} A${r + 9} ${r + 9} 0 0 1 ${a2} ${b2}" stroke="var(--good)" stroke-width="8" stroke-linecap="round" fill="none"/>`;
    for (let c = -50; c <= 50; c += 5) { const major = c % 25 === 0, len = major ? 16 : 8; const [x1, y1] = pt(c, r), [x2, y2] = pt(c, r - len);
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--muted)" stroke-opacity="${major ? 1 : .6}" stroke-width="${major ? 2.4 : 1.4}" stroke-linecap="round"/>`; }
    s += `<text x="20" y="156" font-size="12" font-weight="700" fill="var(--muted)">Flat</text><text x="240" y="156" text-anchor="end" font-size="12" font-weight="700" fill="var(--muted)">Sharp</text>`;
    s += `<g id="tNeedle" style="transform-origin:${cx}px ${cy}px;transform:rotate(0deg)"><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - 100}" stroke-width="4" stroke-linecap="round" class="needle"/></g>`;
    s += `<circle cx="${cx}" cy="${cy}" r="9" class="hub"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--surface-solid)"/>`;
    return s + '</svg>';
  }

  async function ensureCtx() {
    if (!T.ctx) {
      T.ctx = new (window.AudioContext || window.webkitAudioContext)();
      T.input = T.ctx.createGain();
      T.analyser = T.ctx.createAnalyser(); T.analyser.fftSize = 4096; T.buf = new Float32Array(T.analyser.fftSize);
      T.chordAn = T.ctx.createAnalyser(); T.chordAn.fftSize = 16384; T.chordAn.smoothingTimeConstant = 0.6;
      T.input.connect(T.analyser); T.input.connect(T.chordAn);
    }
    if (T.ctx.state === 'suspended') await T.ctx.resume();
  }
  function stopSource() {
    if (T.src) { try { T.src.disconnect(); } catch (e) {} T.src = null; }
    if (T.stream) { T.stream.getTracks().forEach(t => t.stop()); T.stream = null; }
    if (T.sim) { T.sim.oscs.forEach(o => { try { o.stop(); } catch (e) {} }); T.sim = null; }
  }
  function startLoop() { cancelAnimationFrame(T.raf); T.hist = []; T.raf = requestAnimationFrame(tLoop); }
  function tunerOff() { stopSource(); cancelAnimationFrame(T.raf); T.listening = false; }

  async function tStart() {
    T.error = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { T.error = "This browser can't use the microphone here. Open Hookline in Chrome or Safari on your phone."; return render(0); }
    try {
      await ensureCtx();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      stopSource(); T.stream = stream; T.src = T.ctx.createMediaStreamSource(stream); T.src.connect(T.input);
      T.listening = 'mic'; profile.mic = 'granted'; save(); startLoop();
    } catch (e) {
      T.error = e && e.name === 'NotAllowedError' ? 'Microphone access is blocked. Allow it in your browser settings, then try again.' : "We couldn't reach a microphone. Check that one is connected, then try again.";
    }
    render(0);
  }
  async function tSim(cents) {   // test signal: a guitar-like tone on the selected string, routed only to the analyser
    await ensureCtx(); stopSource();
    const osc = T.ctx.createOscillator(), lp = T.ctx.createBiquadFilter(), g = T.ctx.createGain();
    osc.type = 'sawtooth'; osc.frequency.value = freqOf(curTuning().notes[T.sel]) * Math.pow(2, cents / 1200);
    lp.type = 'lowpass'; lp.frequency.value = 1800; g.gain.value = 0.25;
    osc.connect(lp); lp.connect(g); g.connect(T.input); osc.start();
    T.sim = { oscs: [osc] }; T.src = g; T.listening = 'sim'; startLoop(); render(0);
  }
  async function tSimChord(notes) {   // test signal: several guitar-like tones at once
    await ensureCtx(); stopSource();
    const lp = T.ctx.createBiquadFilter(), g = T.ctx.createGain(); lp.type = 'lowpass'; lp.frequency.value = 2400; g.gain.value = 0.5;
    const oscs = notes.map((m, i) => { const o = T.ctx.createOscillator(), og = T.ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = freqOf(m) * Math.pow(2, (i % 2 ? 3 : -3) / 1200); og.gain.value = 0.09; o.connect(og); og.connect(lp); o.start(); return o; });
    lp.connect(g); g.connect(T.input);
    T.sim = { oscs }; T.src = g; T.listening = 'sim'; startLoop(); render(0);
  }
  async function playRef(midi) {
    await ensureCtx();
    const m = typeof midi === 'number' ? midi : curTuning().notes[T.sel], o = T.ctx.createOscillator(), g = T.ctx.createGain(), t0 = T.ctx.currentTime;
    o.type = 'triangle'; o.frequency.value = freqOf(m);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.35, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + 2.2);
    o.connect(g); g.connect(T.ctx.destination); o.start(t0); o.stop(t0 + 2.3);
  }

  function tLoop(now) {
    T.raf = requestAnimationFrame(tLoop);
    if (now - T.lastRun > 45) { T.lastRun = now; analyse(now); }
    T.shown += (T.target - T.shown) * 0.22;
    const nd = document.getElementById('tNeedle'); if (nd) nd.style.transform = `rotate(${Math.max(-50, Math.min(50, T.shown)) * 1.8}deg)`;
  }
  const setText = (id, v) => { const el = document.getElementById(id); if (el && el.textContent !== v) el.textContent = v; };
  function analyse(now) {
    if (!T.analyser) return;
    T.analyser.getFloatTimeDomainData(T.buf);
    const f0 = detectPitch(T.buf, T.ctx.sampleRate);
    if (f0 > 55 && f0 < 1100) { T.hist.push(f0); if (T.hist.length > 5) T.hist.shift(); T.lastHeard = now; }
    else if (now - T.lastHeard > 450) T.hist = [];
    const gauge = document.getElementById('tGauge'), hint = document.getElementById('tHint');
    if (!gauge || !hint) return;
    if (!T.hist.length) {
      T.target = 0; T.holdStr = -1; gauge.classList.remove('intune'); hint.className = 'tu-hint';
      setText('tNote', '‚Äì'); setText('tOct', ''); setText('tHint', T.mode === 'manual' ? `Pluck the ${STRING_LABELS[T.sel]} string` : 'Pluck any string');
      setText('tFreq', ' '); markActive(-1); return;
    }
    const f = median(T.hist), tun = curTuning();
    let s = T.sel, cents;
    if (T.mode === 'auto') {
      let best = Infinity;
      tun.notes.forEach((m, i) => { const c = 1200 * Math.log2(f / freqOf(m)); if (Math.abs(c) < Math.abs(best)) { best = c; s = i; } });
      cents = best;
    } else cents = 1200 * Math.log2(f / freqOf(tun.notes[s]));
    const m = Math.round(69 + 12 * Math.log2(f / profile.a4));
    setText('tNote', noteName(m, tun.flats)); setText('tOct', String(noteOct(m)));
    const far = Math.abs(cents) > 250;
    if (far) {
      T.target = cents > 0 ? 50 : -50; gauge.classList.remove('intune'); hint.className = 'tu-hint warn';
      setText('tHint', T.mode === 'auto' ? "That note isn't near a string in this tuning" : `Far from ${noteName(tun.notes[s], tun.flats)}. Try the ${STRING_LABELS[s]} string`);
      setText('tFreq', `${f.toFixed(1)} Hz`); markActive(T.mode === 'auto' ? -1 : s); T.holdStr = -1; return;
    }
    T.target = cents; markActive(s);
    const ok = Math.abs(cents) <= IN_TUNE;
    gauge.classList.toggle('intune', ok);
    hint.className = 'tu-hint ' + (ok ? 'good' : 'warn');
    setText('tHint', ok ? 'In tune' : cents < 0 ? `Too low ¬∑ tighten the ${STRING_LABELS[s]} string` : `Too high ¬∑ loosen the ${STRING_LABELS[s]} string`);
    setText('tFreq', `${cents > 0 ? '+' : ''}${Math.round(cents)} cents ¬∑ ${f.toFixed(1)} Hz (target ${freqOf(tun.notes[s]).toFixed(1)} Hz)`);
    if (ok) { if (T.holdStr !== s) { T.holdStr = s; T.holdSince = now; } else if (now - T.holdSince > 650 && !T.tuned.has(s)) markTuned(s); }
    else T.holdStr = -1;
  }
  function markActive(s) { document.querySelectorAll('.tstr').forEach((b, i) => b.classList.toggle('active', i === s)); }
  function markTuned(s) {
    T.tuned.add(s);
    const b = document.querySelector(`.tstr[data-i="${s}"]`); if (b) b.classList.add('done');
    if (T.onTuned) T.onTuned(s);
    setText('tProg', progressText());
    if (T.tuned.size === 6) { const d = ensureDay(); if (!d.tune) { d.tune = true; save(); award(POINTS.tune, 'Daily tune-up'); setText('tProg', progressText()); } }
  }
  function progressText() {
    const n = T.tuned.size, d = ensureDay();
    if (n === 6) return d.tune ? 'All 6 strings in tune. Daily tune-up earned.' : 'All 6 strings in tune.';
    return `${n} of 6 strings in tune${d.tune ? '' : ` ¬∑ tune all 6 for +${POINTS.tune} points`}`;
  }

  STEPS.tuner = {
    bare: true,
    body: () => { const tun = curTuning();
      return `<div class="tu-head"><h1 class="title" style="margin:0">Tuner</h1><button class="chip-btn" data-act="tsheet" aria-label="Tuning: ${esc(tun.name)}. Change tuning">${esc(tun.name)} ${ic('chevdown', 16)}</button></div>
      <div class="tu-gauge">${tunerGauge()}</div>
      <div class="tu-read" aria-live="polite"><div class="tu-note"><span id="tNote">‚Äì</span><sup id="tOct"></sup></div>
        <p id="tHint" class="tu-hint">${T.listening ? 'Pluck any string' : 'Tap Start, then pluck a string'}</p><p id="tFreq" class="tu-freq"> </p></div>
      <div class="tu-strings" role="group" aria-label="Strings, thickest to thinnest">${tun.notes.map((m, i) => `<button class="tstr${T.mode === 'manual' && T.sel === i ? ' sel' : ''}${T.tuned.has(i) ? ' done' : ''}" data-act="tstr" data-i="${i}" aria-label="${STRING_LABELS[i]} string, ${noteName(m, tun.flats)}"><span class="tn">${noteName(m, tun.flats)}</span><small>${STRING_LABELS[i]}</small><i class="tchk">${ic('check', 10)}</i></button>`).join('')}</div>
      <div class="seg tu-mode"><div role="button" tabindex="0" class="${T.mode === 'auto' ? 'on' : ''}" data-act="tmode" data-m="auto">Auto-detect</div><div role="button" tabindex="0" class="${T.mode === 'manual' ? 'on' : ''}" data-act="tmode" data-m="manual">One string</div></div>
      <p class="tu-progress" id="tProg">${progressText()}</p>
      ${T.error ? `<p class="status bad" style="margin:0 0 10px">${esc(T.error)}</p>` : ''}
      ${T.listening
        ? `<div class="tu-live"><span class="pill"><i class="dot"></i>${T.listening === 'sim' ? 'Test signal' : 'Listening'}</span><button class="text-btn" data-act="tstop">${ic('stop', 14)} Stop</button></div>`
        : `<button class="btn btn-primary" data-act="tstart">${ic('mic', 20)}Start tuner</button>`}
      ${T.mode === 'manual' ? `<button class="btn btn-ghost" data-act="tref">${ic('speaker', 18)}Play the ${noteName(tun.notes[T.sel], tun.flats)} note</button>` : ''}
      <details class="dev"><summary>Test without a guitar <span class="note" style="margin:0">(plays a test tone into the tuner)</span></summary>
        <p class="note" style="margin:8px 0 0">Uses the ${STRING_LABELS[T.sel]} string (${noteName(tun.notes[T.sel], tun.flats)}). Tap a string above to change it.</p>
        <div class="dev-grid"><button data-act="tsim" data-c="-22">22 cents flat</button><button data-act="tsim" data-c="0">In tune</button><button data-act="tsim" data-c="14">14 cents sharp</button><button data-act="tsim" data-c="-500">Wrong string</button></div></details>`; },
    foot: () => `<button class="btn btn-alt" data-act="tsheet">${ic('guitar', 20)}Alternate tunings</button>${tabbar('tuner')}`,
    leave: () => tunerOff()
  };

  const TUNER_ACTIONS = {
    tstart: () => tStart(),
    tstop: () => { tunerOff(); render(0); },
    tstr: a => { T.sel = +a.dataset.i; T.mode = 'manual'; T.hist = []; render(0); },
    tmode: a => { T.mode = a.dataset.m; T.hist = []; render(0); },
    tref: () => playRef(),
    tsim: a => { const c = +a.dataset.c; tSim(c === -500 ? 500 : c); },
    tsheet: () => openSheet()
  };

  /* alternate tunings sheet */
  function openSheet() {
    T.draft = { name: '', notes: curTuning().notes.slice() };
    const el = document.createElement('div'); el.className = 'overlay sheet-wrap'; el.id = 'tSheet';
    el.addEventListener('click', sheetClick);
    el.addEventListener('input', e => { if (e.target.id === 'tcName') T.draft.name = e.target.value; });

  }

  function refreshSheet() {
    const el = document.getElementById('tSheet'); if (!el) return;
    const prev = el.querySelector('.sheet'), st = prev ? prev.scrollTop : 0, cur = curTuning();
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Alternate tunings">
      <div class="sheet-head"><h2>Alternate tunings</h2><button class="icon-btn" data-s="close" aria-label="Close">${ic('x', 20)}</button></div>
      <div class="tlist">${allTunings().map(t => `<button class="topt${t.id === cur.id ? ' on' : ''}" data-s="pick" data-id="${t.id}">
        <span class="tt"><b>${esc(t.name)}</b><small>${t.notes.map(m => noteName(m, t.flats)).join(' ¬∑ ')}</small></span>
        ${t.custom ? `<span class="tdel" data-s="del" data-id="${t.id}" role="button" tabindex="0" aria-label="Delete ${esc(t.name)}">${ic('x', 16)}</span>` : ''}
        <span class="tick">${ic('check', 14)}</span></button>`).join('')}</div>
      <p class="section-title">Make your own</p>
      <p class="note" style="margin:0 0 10px">Pick the note each string should be tuned to.</p>
      <div class="tcustom">${T.draft.notes.map((m, i) => `<div class="tc-row"><span class="tc-l">${STRING_LABELS[i]} string</span>
        <button data-s="dn" data-i="${i}" aria-label="Lower the ${STRING_LABELS[i]} string"${m <= STD[i] - 7 ? ' disabled' : ''}>‚àí</button>

        <button data-s="up" data-i="${i}" aria-label="Raise the ${STRING_LABELS[i]} string"${m >= STD[i] + 4 ? ' disabled' : ''}>+</button>

    el.querySelector('.sheet').scrollTop = st;
  }
  function sheetClick(e) {
    const b = e.target.closest('[data-s]');

    if (s === 'close') return closeSheet();
    if (s === 'del') { e.stopPropagation(); profile.customTunings = profile.customTunings.filter(t => t.id !== b.dataset.id); if (profile.tuningId === b.dataset.id) profile.tuningId = 'standard'; save(); refreshSheet(); if (current === 'tuner') render(0); return; }
    if (s === 'pick') { const t = allTunings().find(x => x.id === b.dataset.id); profile.tuningId = t.id; save(); T.tuned.clear(); closeSheet(); render(0); toast(`Tuning set to ${t.name}`); return; }

  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); } });

  const STEP1_PARTS = [
    { icon: 'guitar', t: 'Meet the strings', s: 'Learn the name of each of the 6 strings' },

  /* ---------- Step 1: Learn the basics (Phase 3) ---------- */
  const S1 = () => profile.step1;
  const STRINGS_INFO = [
    { num: '6th', name: 'Low E', short: 'E', note: 40, hint: 'The thickest string' },
    { num: '5th', name: 'A', short: 'A', note: 45, hint: '' },

  const CHORD_LESSONS = {
    C: { frets: ['x', 3, 2, 0, 1, 0], fingers: [{ s: 4, fret: 1, f: 1 }, { s: 2, fret: 2, f: 2 }, { s: 1, fret: 3, f: 3 }], strum: 'Strum from the 5th string down. Skip the 6th string (marked X).' },
    A: { frets: ['x', 0, 2, 2, 2, 0], fingers: [{ s: 2, fret: 2, f: 1 }, { s: 3, fret: 2, f: 2 }, { s: 4, fret: 2, f: 3 }], strum: 'Strum from the 5th string down. Skip the 6th string (marked X).' },
    G: { frets: [3, 2, 0, 0, 0, 3], fingers: [{ s: 1, fret: 2, f: 1 }, { s: 0, fret: 3, f: 2 }, { s: 5, fret: 3, f: 3 }], strum: 'Strum all 6 strings.' },
    E: { frets: [0, 2, 2, 1, 0, 0], fingers: [{ s: 3, fret: 1, f: 1 }, { s: 1, fret: 2, f: 2 }, { s: 2, fret: 2, f: 3 }], strum: 'Strum all 6 strings.' },
    D: { frets: ['x', 'x', 0, 2, 3, 2], fingers: [{ s: 3, fret: 2, f: 1 }, { s: 5, fret: 2, f: 2 }, { s: 4, fret: 3, f: 3 }], strum: 'Strum from the 4th string down. Skip the 6th and 5th strings (marked X).' }
  };
  const voicing = c => CHORD_LESSONS[c].frets.map((f, i) => f === 'x' ? null : STD[i] + f).filter(m => m !== null);
  const CHORD_PCS = { C: [0, 4, 7], A: [9, 1, 4], G: [7, 11, 2], E: [4, 8, 11], D: [2, 6, 9], Em: [4, 7, 11], Am: [9, 0, 4], Dm: [2, 5, 9], F: [5, 9, 0], Bm: [11, 2, 6] };
  const CHORD_LABEL = c => CHORD_NAMES[c] || c;
  const TIP_FINGERS = 'When your fingertips start to hurt, play a couple more minutes and then put the guitar down. Sticking with your learning plan, you will build callouses within a few weeks of consistent playing.';
  const quizDue = () => !S1().mastered && S1().quizDate !== today() && ['quiz', 'tune', 'chord', 'done', 'check'].includes(S1().stage);

  function stringsSVG(hl = -1, labels = true, tappable = false) {
    let s = `<svg class="strings-svg" viewBox="0 0 320 206" role="img" aria-label="The six guitar strings, thickest on top">`;
    s += '<rect x="58" y="6" width="256" height="194" rx="10" fill="rgba(20,6,2,.55)"/><rect x="58" y="6" width="8" height="194" fill="#e8dcc8" opacity=".85"/>';
    STRINGS_INFO.forEach((st, i) => {
      const y = 22 + i * 32, w = 4.6 - i * 0.65, on = i === hl;
      if (tappable) s += `<rect x="0" y="${y - 16}" width="320" height="32" fill="transparent" data-act="pluck" data-i="${i}" style="cursor:pointer"><title>Play the ${st.num} string</title></rect>`;
      s += `<line x1="66" y1="${y}" x2="314" y2="${y}" stroke="${on ? 'var(--accent)' : i < 3 ? '#c9a46a' : '#d9d4cc'}" stroke-width="${on ? w + 1.5 : w}" stroke-linecap="round" pointer-events="none"${on ? ' class="glow"' : ''}/>`;
      s += `<text x="50" y="${y + 4}" text-anchor="end" font-size="12" font-weight="700" fill="${on ? 'var(--accent)' : 'var(--muted)'}" pointer-events="none">${st.num}</text>`;
      if (labels) s += `<text x="300" y="${y - 6}" text-anchor="end" font-size="13" font-weight="800" fill="var(--text)" pointer-events="none">${st.name}</text>`;
      else if (on) s += `<text x="300" y="${y - 6}" text-anchor="end" font-size="15" font-weight="800" fill="var(--accent)" pointer-events="none">?</text>`;
    });
    return s + '</svg>';
  }

  function fretSVG(c, step) {
    const L = CHORD_LESSONS[c], n = L.fingers.length, cur = step < n ? step : -1;
    const X = i => 32 + i * 28, Y = f => 46 + (f - 0.5) * 40;
    let s = `<svg class="fret-svg" viewBox="0 0 204 236" role="img" aria-label="${CHORD_LABEL(c)} chord diagram">`;
    for (let f = 0; f <= 4; f++) s += `<line x1="${X(0)}" y1="${46 + f * 40}" x2="${X(5)}" y2="${46 + f * 40}" stroke="var(--text)" stroke-opacity="${f ? .45 : 1}" stroke-width="${f ? 1.5 : 5}"/>`;
    for (let f = 1; f <= 4; f++) s += `<text x="10" y="${Y(f) + 4}" font-size="11" fill="var(--muted)" font-weight="700">${f}</text>`;
    for (let i = 0; i < 6; i++) {
      s += `<line x1="${X(i)}" y1="46" x2="${X(i)}" y2="206" stroke="var(--text)" stroke-opacity=".75" stroke-width="${3.2 - i * 0.4}"/>`;
      s += `<text x="${X(i)}" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">${STRINGS_INFO[i].short}</text>`;
      const v = L.frets[i], strumStep = step >= n;
      if (v === 'x') s += `<path d="M${X(i) - 6} 20l12 12M${X(i) + 6} 20l-12 12" stroke="${strumStep ? 'var(--danger)' : 'var(--muted)'}" stroke-width="2.4" stroke-linecap="round"/>`;
      else if (v === 0) s += `<circle cx="${X(i)}" cy="26" r="6.5" fill="none" stroke="${strumStep ? 'var(--good)' : 'var(--muted)'}" stroke-width="2.2"/>`;
    }
    L.fingers.forEach((p, k) => {
      if (k > step) return;
      const isCur = k === cur;
      s += `<g${isCur ? ' class="fpulse"' : ''}><circle cx="${X(p.s)}" cy="${Y(p.fret)}" r="12.5" fill="${isCur ? 'var(--accent)' : 'var(--text)'}"/><text x="${X(p.s)}" y="${Y(p.fret) + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="${isCur ? 'var(--on-accent)' : 'var(--surface-solid)'}">${p.f}</text></g>`;
    });
    return s + '</svg>';
  }

  /* chord recognition: pitch-class energy from the spectrum, matched against chord shapes */
  let fbuf = null;
  function detectChord() {
    if (!T.chordAn || !T.listening) return null;
    T.analyser.getFloatTimeDomainData(T.buf);
    let rms = 0; for (let i = 0; i < 2048; i++) rms += T.buf[i] * T.buf[i]; rms = Math.sqrt(rms / 2048);
    if (rms < 0.01) return null;
    const n = T.chordAn.frequencyBinCount; if (!fbuf || fbuf.length !== n) fbuf = new Float32Array(n);
    T.chordAn.getFloatFrequencyData(fbuf);
    const binHz = T.ctx.sampleRate / T.chordAn.fftSize, chroma = new Float32Array(12);
    const lo = Math.ceil(75 / binHz), hi = Math.min(n - 1, Math.floor(1400 / binHz));
    for (let k = lo; k < hi; k++) {
      const db = fbuf[k]; if (db < -85 || db < fbuf[k - 1] || db < fbuf[k + 1]) continue;   // spectral peaks only
      const f = k * binHz, pc = ((Math.round(12 * Math.log2(f / profile.a4)) + 69) % 12 + 12) % 12;
      const w = f < 400 ? 1 : 400 / f;   // favour the fundamentals over high overtones
      chroma[pc] += Math.pow(10, db / 20) * w;
    }
    let norm = 0; for (let i = 0; i < 12; i++) norm += chroma[i] * chroma[i]; norm = Math.sqrt(norm); if (!norm) return null;
    const scores = Object.keys(CHORD_PCS).map(c => { const p = CHORD_PCS[c]; let dot = 0; p.forEach(x => dot += chroma[x]); return { c, s: dot / (norm * Math.sqrt(p.length)) }; }).sort((a, b) => b.s - a.s);
    return { name: scores[0].c, score: scores[0].s, margin: scores[0].s - scores[1].s };
  }
  const CL = { raf: 0, target: null, streak: 0, lastRun: 0, onPass: null };
  const NEED = 8;   // about 0.7 s of a steady match
  function startChordLoop(target, onPass) {
    cancelAnimationFrame(CL.raf); CL.target = target; CL.onPass = onPass; CL.streak = 0;
    const loop = now => {
      CL.raf = requestAnimationFrame(loop);
      if (now - CL.lastRun < 85) return; CL.lastRun = now;
      const r = detectChord(), heard = document.getElementById('cHeard'), bar = document.getElementById('cBar');
      if (!heard) return;
      if (!r) { CL.streak = Math.max(0, CL.streak - 1); heard.textContent = 'Listening‚Ä¶ strum and let it ring'; heard.className = 'lis-heard'; }
      else {
        const ok = r.name === CL.target && r.score > 0.7 && r.margin > 0.015;
        CL.streak = ok ? CL.streak + 1 : Math.max(0, CL.streak - 2);
        heard.textContent = ok ? `Hearing ${CHORD_LABEL(r.name)}. Keep it ringing‚Ä¶` : `That sounds like ${CHORD_LABEL(r.name)}. Check your fingers and try again.`;
        heard.className = 'lis-heard ' + (ok ? 'good' : 'warn');
      }
      if (bar) bar.style.width = Math.min(100, CL.streak / NEED * 100) + '%';
      if (CL.streak >= NEED) { stopChordLoop(); tunerOff(); const cb = CL.onPass; CL.onPass = null; if (cb) cb(); }
    };
    CL.raf = requestAnimationFrame(loop);
  }
  function stopChordLoop() { cancelAnimationFrame(CL.raf); }

  const L = { passed: false };   // per-screen state that doesn't need saving
  const Q = { order: [], i: 0, correct: 0, answered: null, firstTry: true, mode: 'lesson' };
  function newQuiz(mode) { Q.order = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5); Q.i = 0; Q.correct = 0; Q.answered = null; Q.mode = mode; }

  function listenBlock(c, extraTest = '') {
    return `<div class="listen">
      <div class="lis-target">${chordSVG(CH[c])}<div><small>Play</small><b>${CHORD_LABEL(c)}</b><span class="note" style="margin:0">${CHORD_LESSONS[c].strum}</span></div></div>
      <div class="meter-row"><span>Match</span><span class="rbar" style="--lvl:var(--good)"><i id="cBar" style="width:${L.passed ? 100 : 0}%"></i></span></div>
      <p class="lis-heard${L.passed ? ' good' : ''}" id="cHeard">${L.passed ? `${CHORD_LABEL(c)} sounds great.` : T.listening ? 'Listening‚Ä¶ strum and let it ring' : 'Tap Start listening, then strum the chord and let it ring.'}</p>
      ${T.error ? `<p class="status bad" style="margin:0 0 8px">${esc(T.error)}</p>` : ''}
      ${L.passed ? '' : T.listening
        ? `<div class="tu-live"><span class="pill"><i class="dot"></i>${T.listening === 'sim' ? 'Test signal' : 'Listening'}</span><button class="text-btn" data-act="lstop">${ic('stop', 14)} Stop</button></div>`
        : `<button class="btn btn-primary" data-act="listen">${ic('mic', 20)}Start listening</button>`}
      ${L.passed ? '' : `<details class="dev"><summary>Test without a guitar</summary><div class="dev-grid">
        <button data-act="csim" data-c="${c}">Play ${c} (correct)</button><button data-act="csim" data-c="${c === 'G' ? 'C' : 'G'}">Play a wrong chord</button>${extraTest}</div></details>`}
    </div>`;
  }

  function lessonProgress() {
    const st = S1(); if (st.stage === 'check') return Math.round(st.check / 5 * 100);
    const idx = { strings: 0, quiz: 1, tune: 2, chord: 3 + st.chord, done: 8 }[st.stage] || 0;
    return Math.round(idx / 8 * 100);
  }

  function lessonBody() {
    const st = S1();
    if (L.quizOnly || st.stage === 'quiz') return quizBody();
    if (st.stage === 'strings') return `<p class="eyebrow">Part 1 ¬∑ Meet the strings</p><h1 class="title">Your six strings</h1>
      <p class="lead">Strings are numbered from the thinnest (1st) to the thickest (6th). Looking down at your guitar while you play, the thickest string is on top.</p>
      <div class="strings-wrap">${stringsSVG(-1, true, true)}</div>
      <p class="note" style="text-align:center;margin:6px 0 14px">Tap a string to hear it.</p>
      <div class="callout">${ic('star')}<span><b>Remember them, top to bottom:</b> <i>Eddie Ate Dynamite, Good Bye Eddie</i> = E A D G B E</span></div>`;
    if (st.stage === 'tune') { T.mode = 'manual';
      return `<p class="eyebrow">Part 3 ¬∑ Pluck and tune</p><h1 class="title">Tune each string</h1>
      <p class="lead">Pluck the highlighted string and let it ring. Follow the tuner until the needle turns green, then move to the next one.</p>
      <div class="tu-gauge">${tunerGauge()}</div>
      <div class="tu-read" aria-live="polite"><div class="tu-note"><span id="tNote">‚Äì</span><sup id="tOct"></sup></div>
        <p id="tHint" class="tu-hint">${T.listening ? `Pluck the ${STRING_LABELS[T.sel]} string` : 'Tap Start, then pluck the string'}</p><p id="tFreq" class="tu-freq"> </p></div>
      <div class="tu-strings">${STD.map((m, i) => `<button class="tstr${T.sel === i ? ' sel' : ''}${T.tuned.has(i) ? ' done' : ''}" data-act="tstr" data-i="${i}" aria-label="${STRING_FULL[i]} string"><span class="tn">${STRINGS_INFO[i].short}</span><small>${STRING_LABELS[i]}</small><i class="tchk">${ic('check', 10)}</i></button>`).join('')}</div>
      <p class="tu-progress">${T.tuned.size} of 6 strings in tune</p>
      ${T.error ? `<p class="status bad" style="margin:0 0 10px">${esc(T.error)}</p>` : ''}
      ${T.tuned.size === 6 ? '' : T.listening
        ? `<div class="tu-live"><span class="pill"><i class="dot"></i>${T.listening === 'sim' ? 'Test signal' : 'Listening'}</span><button class="text-btn" data-act="tstop">${ic('stop', 14)} Stop</button></div>`
        : `<button class="btn btn-primary" data-act="tstart">${ic('mic', 20)}Start tuner</button>`}
      <details class="dev"><summary>Test without a guitar</summary><div class="dev-grid"><button data-act="tsim" data-c="-18">Selected string, flat</button><button data-act="tsim" data-c="0">Selected string, in tune</button></div></details>`; }
    if (st.stage === 'chord') { const c = BASICS[st.chord], CLs = CHORD_LESSONS[c], n = CLs.fingers.length;
      if (st.sub === 'learn') { const f = CLs.fingers[st.finger];
        return `<p class="eyebrow">Part 4 ¬∑ Chord ${st.chord + 1} of 5</p><h1 class="title">${CHORD_LABEL(c)}</h1>
        <div class="fret-wrap">${fretSVG(c, st.finger)}</div>
        <div class="finger-card">${f
          ? `<span class="fnum">${f.f}</span><div><small>Finger ${st.finger + 1} of ${n}</small><b>${FINGER_NAMES[f.f]} finger on the ${STRING_FULL[f.s]} string, fret ${f.fret}</b></div>`
          : `<span class="fnum strum">${ic('guitar', 20)}</span><div><small>Now strum</small><b>${CLs.strum}</b></div>`}</div>
        <p class="note">${f ? 'Press with your fingertip just behind the fret wire. Keep the knuckle curved so you don\'t touch the strings next to it.' : 'X means don\'t play that string. O means play it open, with no finger on it.'}</p>`; }
      return `<p class="eyebrow">Part 4 ¬∑ Chord ${st.chord + 1} of 5</p><h1 class="title">Let's hear your ${c}</h1>
        ${L.passed ? `<div class="success">${ic('check', 22)}<div><b>${CHORD_LABEL(c)} learned</b><span>${profile.learned.includes(c) ? `+${chordPoints(c)} points` : ''}</span></div></div>` : ''}
        ${listenBlock(c)}
        ${L.passed && st.chord === 0 ? `<div class="callout">${ic('pick')}<span><b>Tip:</b> ${TIP_FINGERS}</span></div>` : ''}`; }
    if (st.stage === 'check') { const c = BASICS[st.check];
      return `<p class="eyebrow">Skip check ¬∑ ${st.check + 1} of 5</p><h1 class="title">Show us you know them</h1>
        <p class="lead">Play each chord once. Pass all five and Step 1 is done.</p>
        <div class="check-row">${BASICS.map((x, i) => `<span class="${i < st.check ? 'ok' : i === st.check ? 'now' : ''}">${i < st.check ? ic('check', 12) : ''}${x}</span>`).join('')}</div>
        ${L.passed ? `<div class="success">${ic('check', 22)}<div><b>${CHORD_LABEL(c)} passed</b></div></div>` : ''}
        ${listenBlock(c)}`; }
    if (st.stage === 'done') { const n = basicsLearned();
      return `<div class="done-hero"><span class="done-badge">${ic('check', 44)}</span><p class="eyebrow">Step 1 complete</p><h1 class="title">You've learned the basics</h1>
        <p class="lead">${st.skipped ? 'You showed you already know C, A, G, E and D.' : "That's the hardest part of starting guitar done. With these five chords you can already play hundreds of songs."}</p></div>
        <div class="plan-card">
          <div class="plan-row">${ic('guitar')}<div><small>Strings</small><b>${st.mastered ? 'All 6 named perfectly' : st.skipped ? 'Skipped' : 'Learned ¬∑ keep taking the daily quiz'}</b></div></div>
          <div class="plan-row">${ic('tuner')}<div><small>Tuning</small><b>${st.tuned ? 'Tuned all 6 strings' : 'Skipped'}</b></div></div>
          <div class="plan-row">${ic('chords')}<div><small>Chords</small><b>${n} of 5 learned ¬∑ ${n * 25} points</b></div></div>
        </div>
        <div class="callout">${ic('pick')}<span><b>Tip:</b> ${TIP_FINGERS}</span></div>
        <div class="locked-step" style="margin-top:14px">${ic('lock', 18)}<span>Step 2 is on the way.</span></div>`; }
    return '';
  }

  function quizBody() {
    const st = S1();
    if (!L.quizOnly && st.quizDate === today() && Q.i === 0 && !Q.answered) {
      return `<p class="eyebrow">Part 2 ¬∑ String quiz</p><h1 class="title">${st.mastered ? 'You know your strings' : "Today's quiz is done"}</h1>
        <p class="lead">${st.mastered ? 'You named all 6 strings perfectly. No more daily quiz.' : `Best score so far: ${st.quizBest} of 6. You'll get another try tomorrow until you name all 6.`}</p>${stringsSVG(-1, true)}`;
    }
    if (Q.i >= 6) {
      const perfect = Q.correct === 6;
      return `<p class="eyebrow">String quiz</p><h1 class="title">${perfect ? 'Perfect! 6 of 6' : `${Q.correct} of 6 right`}</h1>
        <p class="lead">${perfect ? "You can name every string on your own. The daily string quiz is done for good." : "Good start. You'll get one try a day until you name all 6 perfectly."}</p>${stringsSVG(-1, true)}`;
    }
    const s = Q.order[Q.i];
    return `<p class="eyebrow">${L.quizOnly ? "Today's string quiz" : 'Part 2 ¬∑ String quiz'} ¬∑ ${Q.i + 1} of 6</p><h1 class="title">Which string is highlighted?</h1>
      <div class="strings-wrap">${stringsSVG(s, false)}</div>
      <div class="qopts">${STRINGS_INFO.map((x, i) => { let cls = ''; if (Q.answered !== null) { if (i === s) cls = ' right'; else if (i === Q.answered) cls = ' wrong'; }
        return `<button class="qopt${cls}" data-act="qans" data-i="${i}"${Q.answered !== null ? ' disabled' : ''}>${x.name}</button>`; }).join('')}</div>
      <p class="qfeed ${Q.answered === null ? '' : Q.answered === s ? 'good' : 'warn'}" aria-live="polite">${Q.answered === null ? ' ' : Q.answered === s ? `Right, that's the ${STRINGS_INFO[s].num} string.` : `Not quite. That's the ${STRINGS_INFO[s].num} string, ${STRINGS_INFO[s].name}.`}</p>`;
  }

  function lessonFoot() {
    const st = S1();
    if (L.quizOnly || st.stage === 'quiz') {
      if (Q.answered !== null && Q.i < 6) return `<button class="btn btn-primary" data-act="qnext">${Q.i === 5 ? 'See my score' : 'Next string'}</button>`;
      if (Q.i >= 6 || st.quizDate === today()) return `<button class="btn btn-primary" data-act="${L.quizOnly ? 'quizexit' : 'lnext'}">${L.quizOnly ? 'Done' : 'Continue to tuning'}</button>`;
      return '';
    }
    if (st.stage === 'strings') return `<button class="btn btn-primary" data-act="lnext">I know my strings, quiz me</button>`;
    if (st.stage === 'tune') return T.tuned.size === 6 || st.tuned
      ? `<button class="btn btn-primary" data-act="lnext">Continue to chords</button>`
      : `<button class="btn btn-ghost" data-act="skiptune">My guitar is already in tune</button>`;
    if (st.stage === 'chord') { const n = CHORD_LESSONS[BASICS[st.chord]].fingers.length;
      if (st.sub === 'learn') return `<div class="btn-row">${st.finger > 0 ? `<button class="btn btn-ghost" data-act="fprev">${ic('back', 18)}Back</button>` : ''}<button class="btn btn-primary" data-act="fnext">${st.finger < n ? 'Next' : "I'm ready, listen"}</button></div>`;
      return L.passed || profile.learned.includes(BASICS[st.chord])
        ? `<button class="btn btn-primary" data-act="cnext">${st.chord < 4 ? `Next chord: ${BASICS[st.chord + 1]}` : 'Finish Step 1'}</button>`
        : `<button class="btn btn-ghost" data-act="cback">${ic('back', 18)}Show me the fingers again</button>`; }
    if (st.stage === 'check') return L.passed ? `<button class="btn btn-primary" data-act="checknext">${st.check < 4 ? `Next: ${BASICS[st.check + 1]}` : 'Finish'}</button>` : `<button class="btn btn-ghost" data-act="nocheck">Skip without checking</button>`;
    if (st.stage === 'done') return `<button class="btn btn-primary" data-act="go" data-view="path">Back to your path</button>`;
    return '';
  }

  STEPS.lesson = {
    bare: true,
    body: () => `<div class="lesson-top"><button class="icon-btn" data-act="go" data-view="path" aria-label="Back to your path">${ic('back')}</button>
        <div class="progress" role="progressbar" aria-label="Step 1 progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${lessonProgress()}"><i style="width:${lessonProgress()}%"></i></div></div>
      ${lessonBody()}`,
    foot: () => lessonFoot(),
    mount: () => {
      const st = S1();
      if (st.stage === 'tune') T.onTuned = s => {
        if (T.tuned.size === 6) { st.tuned = true; save(); tunerOff(); render(0); return; }
        if (s === T.sel) { const next = [0, 1, 2, 3, 4, 5].find(i => !T.tuned.has(i)); T.sel = next; T.hist = []; render(0); }
      };
      const target = st.stage === 'chord' && st.sub === 'listen' ? BASICS[st.chord] : st.stage === 'check' ? BASICS[st.check] : null;
      if (target && T.listening && !L.passed) startChordLoop(target, () => chordPassed(target));
    },
    leave: () => { stopChordLoop(); tunerOff(); T.onTuned = null; L.quizOnly = false; }
  };

  function chordPassed(c) {
    L.passed = true;
    if (!profile.learned.includes(c)) award(chordPoints(c), `Learned ${c} (basic chord)`, () => profile.learned.push(c));
    else toast(`${CHORD_LABEL(c)} sounds great`);
    render(0);
  }
  function setStage(stage) { const st = S1(); st.stage = stage; save(); L.passed = false; stopChordLoop(); tunerOff(); render(1); }
  function finishStep(skipped) { const st = S1(), first = !st.done; st.done = true; st.skipped = !!skipped; setStage('done'); if (first) award(EXTRA.step1, 'Finished Step 1'); }

  const LESSON_ACTIONS = {
    step1: () => { const st = S1(); if (st.stage === 'intro') { st.stage = 'strings'; save(); } if (st.stage === 'quiz' && st.quizDate !== today()) newQuiz('lesson'); L.passed = false; view = 'lesson'; render(1); },
    step1skip: () => { const st = S1(); st.check = 0; st.stage = 'check'; save(); L.passed = false; view = 'lesson'; render(1); },
    dailyquiz: () => { newQuiz('daily'); L.quizOnly = true; view = 'lesson'; render(1); },

  const scaleWindow = sc => {

    return tries.find(([a, b]) => notesInWindow(sc, a, b).length === sc.f.length * 2 + 1) || tries[2];
  };

  function notesInWindow(sc, lo, hi) {   // [{s, fret, midi}] from the lowest root up to the highest root inside frets lo..hi

  /* practice: follow the click, one note per beat, root to root */
  const SP = { idx: 0, times: [], runs: 0, stable: { m: -1, n: 0 }, raf: 0, lastRun: 0, msg: '', msgKind: '', done: false };
  const MET = { timer: 0, next: 0, on: false };
  function metStart(bpm) {

  }
