<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Hookline: learn guitar the quick, free and easy way.">
<title>Hookline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mahogany theme. Phone-first single column; on wide screens the app sits in a framed panel on the wood. */
:root {
  --bg: #2b0f09; --surface: rgba(42, 15, 10, .84); --surface-solid: #2a0f0a; --raised: rgba(62, 26, 16, .92);
  --text: #f8eadb; --muted: #d3ae95; --accent: #e9b04b; --on-accent: #1f0d05; --good: #a2d98c; --danger: #ff9b85;
  --line: rgba(248, 234, 219, .14);
  --r: 16px;
  --display: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#wood { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0; transition: opacity .6s; }
#wood.ready { opacity: 1; }
.shade { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 50% at 40% 0%, rgba(255, 196, 150, .12), transparent 70%),
              linear-gradient(180deg, rgba(20, 6, 2, .25), rgba(20, 6, 2, .6)); }

.shell { position: relative; z-index: 1; height: 100%; display: flex; justify-content: center; }
.app { width: 100%; max-width: 440px; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(20px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) {
  .shell { align-items: center; padding: 28px 16px; }
  .app { min-height: 0; height: min(860px, calc(100dvh - 56px)); border-radius: 36px; padding: 20px 26px 24px;
    background: rgba(24, 7, 3, .45); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .85), inset 0 0 0 1px rgba(255, 220, 180, .08); }
}

/* top bar */
.top { display: flex; align-items: center; gap: 12px; height: 44px; flex: none; }
.top.bare { visibility: hidden; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn.off { visibility: hidden; }
.progress { flex: 1; height: 6px; border-radius: 3px; background: rgba(248, 234, 219, .14); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .35s ease; }
.text-btn { background: none; border: none; color: var(--muted); font-weight: 600; cursor: pointer; padding: 8px 4px; }
.text-btn.off { visibility: hidden; }

/* screen */
#screen { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 2px 8px; display: flex; flex-direction: column; scrollbar-width: none; }
#screen::-webkit-scrollbar { display: none; }
#screen > * { flex-shrink: 0; }
.enter { animation: enter .35s ease both; }
.enter.from-left { animation-name: enterL; }
@keyframes enter { from { opacity: 0; transform: translateX(18px); } }
@keyframes enterL { from { opacity: 0; transform: translateX(-18px); } }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.title { font-family: var(--display); font-size: clamp(28px, 7.6vw, 34px); line-height: 1.06; font-weight: 800; letter-spacing: -.01em; margin: 0 0 10px; text-wrap: balance; text-shadow: 0 2px 10px rgba(0, 0, 0, .45); }
.title:focus { outline: none; }
.lead { color: var(--muted); margin: 0 0 22px; font-size: 15.5px; text-wrap: pretty; }
.note { color: var(--muted); font-size: 13px; margin: 14px 0 0; }

/* option cards */
.options { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--r);
  border: 2px solid transparent; background: var(--surface); cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 220, 180, .06), 0 2px 10px rgba(0, 0, 0, .25); transition: border-color .15s, background .15s, transform .1s; }
.opt:active { transform: scale(.985); }
.opt .oi { width: 42px; height: 42px; border-radius: 12px; background: rgba(233, 176, 75, .14); color: var(--accent); display: grid; place-items: center; flex: none; }
.opt .ot { flex: 1; min-width: 0; }
.opt b { display: block; font-size: 15.5px; font-weight: 600; }
.opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(248, 234, 219, .28); flex: none; display: grid; place-items: center; color: transparent; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--raised); }
.opt[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 11px 17px; border-radius: 99px; border: 2px solid transparent; background: var(--surface); font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--raised); color: var(--accent); }

.chord-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chord-card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border-radius: var(--r); border: 2px solid transparent; background: var(--surface); cursor: pointer; position: relative; }
.chord-card b { font-family: var(--display); font-size: 18px; font-weight: 800; }
.chord-card svg { width: 58px; height: auto; color: var(--text); }
.chord-card .tick { position: absolute; top: 7px; right: 7px; width: 20px; height: 20px; }
.chord-card[aria-pressed="true"] { border-color: var(--accent); background: var(--raised); }
.chord-card[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* fields */
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { height: 56px; border-radius: 14px; border: 2px solid var(--line); background: rgba(22, 7, 3, .78); padding: 0 16px; font-size: 17px; width: 100%; }
.input:focus { border-color: var(--accent); outline: none; }
.input::placeholder { color: rgba(211, 174, 149, .55); }
.error { color: var(--danger); font-size: 13px; min-height: 18px; margin: -4px 0 6px; }

/* practice time */
.times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.time { padding: 16px 8px; border-radius: var(--r); border: 2px solid transparent; background: var(--surface); cursor: pointer; text-align: center; }
.time b { display: block; font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1; }
.time span { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
.time small { display: block; font-size: 12px; font-weight: 600; margin-top: 2px; }
.time[aria-pressed="true"] { border-color: var(--accent); background: var(--raised); }
.time[aria-pressed="true"] b { color: var(--accent); }
.callout { display: flex; gap: 12px; align-items: center; margin-top: 16px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); }
.callout > svg { color: var(--accent); flex: none; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { width: 50px; height: 30px; border-radius: 15px; border: none; background: rgba(248, 234, 219, .2); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: #fff; }
.time-input { height: 40px; border-radius: 10px; border: 2px solid var(--line); background: rgba(22, 7, 3, .78); padding: 0 10px; color-scheme: dark; }

/* mic */
.mic-hero { align-self: center; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; margin: 6px 0 24px;
  background: radial-gradient(circle, rgba(233, 176, 75, .28), rgba(233, 176, 75, .06) 65%, transparent 70%); color: var(--accent); }
.mic-hero.live { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 14px rgba(233, 176, 75, .08); } }
.meter { display: flex; align-items: flex-end; justify-content: center; gap: 5px; height: 64px; margin: 4px 0 14px; }
.meter i { width: 10px; height: 8%; border-radius: 4px; background: rgba(248, 234, 219, .2); transition: height .08s; }
.meter i.on { background: var(--accent); }
.status { text-align: center; font-weight: 600; min-height: 22px; }
.status.ok { color: var(--good); }
.status.bad { color: var(--danger); font-weight: 500; }
.privacy { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: rgba(22, 7, 3, .55); color: var(--muted); font-size: 13px; margin-top: auto; }
.privacy svg { flex: none; color: var(--good); margin-top: 1px; }

/* welcome */
.welcome { justify-content: flex-start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
.brand-mark { width: 44px; height: 44px; border-radius: 13px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 8px 20px -8px rgba(233, 176, 75, .7); }
.brand span { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.hero-card { border-radius: 22px; padding: 18px; background: var(--surface); box-shadow: 0 16px 40px -18px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 220, 180, .07); margin-bottom: 26px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: rgba(233, 176, 75, .16); color: var(--accent); font-size: 12px; font-weight: 700; }
.hero-chords { display: flex; align-items: center; justify-content: center; gap: 14px; }
.hero-chords .hc { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hero-chords svg.chord { width: 72px; }
.hero-chords b { font-family: var(--display); font-size: 20px; font-weight: 800; }
.hero-chords .arrow { color: var(--accent); }
.hero-meta { display: flex; justify-content: space-between; margin-top: 14px; color: var(--muted); font-size: 13px; }
.values { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.values li { display: flex; gap: 12px; align-items: flex-start; }
.values li svg { color: var(--accent); flex: none; margin-top: 2px; }
.values b { display: block; }
.values span { color: var(--muted); font-size: 14px; }

/* ready / plan */
.plan-card { border-radius: 20px; background: var(--surface); padding: 6px 16px; box-shadow: 0 16px 40px -20px rgba(0, 0, 0, .8); }
.plan-row { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
.plan-row:last-child { border-bottom: none; }
.plan-row > svg { color: var(--accent); flex: none; }
.plan-row div { flex: 1; min-width: 0; }
.plan-row small { display: block; color: var(--muted); font-size: 12.5px; }
.plan-row b { font-weight: 600; }
.path { display: flex; align-items: center; margin: 22px 0 6px; }
.path .node { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
.path .dot { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--surface-solid); color: var(--muted); border: 2px solid var(--line); }
.path .node.known .dot { background: var(--good); color: #173014; border-color: transparent; }
.path .node.next .dot { background: var(--accent); color: var(--on-accent); border-color: transparent; box-shadow: 0 0 0 5px rgba(233, 176, 75, .25); }
.path .node small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.path .link { flex: 1; height: 2px; background: var(--line); margin: 0 4px 20px; min-width: 8px; }

/* home placeholder */
.hello { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-solid); border: 2px solid var(--accent); color: var(--accent); font-weight: 700; }
.hook-card { border-radius: 22px; overflow: hidden; background: var(--surface); margin-bottom: 14px; }
.hook-cover { aspect-ratio: 16 / 9; display: grid; place-items: center; color: #fff; position: relative;
  background: radial-gradient(circle at 30% 25%, #f7d48b, var(--accent) 40%, #7a4a12); }
.hook-cover .pill { position: absolute; top: 12px; left: 12px; background: rgba(0, 0, 0, .45); color: #fff; }
.hook-body { padding: 14px 16px 16px; }
.hook-body b { font-family: var(--display); font-size: 20px; font-weight: 800; }

button.hook-card { display: block; width: 100%; padding: 0; border: none; text-align: left; cursor: pointer; }

/* ranks */
.section-title { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 20px 0 10px; }
.badge { width: 60px; height: 68px; flex: none; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .45)); }
.badge.big { width: 112px; height: 126px; }
.rank-card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 14px 14px 12px; border: none; border-radius: 20px; text-align: left; cursor: pointer;
  background: var(--surface); box-shadow: 0 14px 34px -18px rgba(0, 0, 0, .85), inset 0 1px 0 rgba(255, 220, 180, .07); }
.rank-card .rk { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rank-card small { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rank-card .rname { font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.15; }
.rank-card .chev { color: var(--muted); flex: none; }
.rbar { display: block; height: 8px; border-radius: 4px; background: rgba(248, 234, 219, .14); overflow: hidden; margin: 8px 0 5px; }
.rbar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--lvl), color-mix(in srgb, var(--lvl) 70%, #fff)); transition: width .5s ease; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tasks { display: grid; gap: 8px; }
.task { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); font-weight: 500; }
.task .tk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(248, 234, 219, .28); display: grid; place-items: center; flex: none; }
.task.done .tk { background: var(--good); border-color: var(--good); color: #173014; }
.task .pts { margin-left: auto; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.task.done .pts { color: var(--good); }
.task.done > span:nth-child(2) { color: var(--muted); }
.hook-card { margin-top: 14px; }
.activity { display: grid; border-radius: 14px; background: var(--surface); padding: 2px 14px; }
.act-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.act-row:last-child { border-bottom: none; }
.act-row b { color: var(--accent); font-variant-numeric: tabular-nums; }
.rank-hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
.rank-hero .rbar { width: 100%; }
.ladder { display: grid; gap: 10px; }
.lvl { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 16px; background: var(--surface); }
.lvl .badge { width: 42px; height: 48px; }
.lvl b { font-family: var(--display); font-size: 17px; font-weight: 800; }
.lvl.current { box-shadow: inset 0 0 0 2px var(--lvl); }
.lvl.locked .badge { filter: saturate(.55) brightness(.75); opacity: .85; }
.lvl.locked b { color: var(--muted); }
.tiers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.tiers span { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: rgba(248, 234, 219, .08); color: var(--muted); font-variant-numeric: tabular-nums; }
.tiers span.got { background: color-mix(in srgb, var(--lvl) 28%, transparent); color: var(--text); }
.req { display: flex; gap: 6px; align-items: flex-start; margin-top: 7px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.req > svg { flex: none; margin-top: 1px; color: var(--accent); }
.req .met { color: var(--good); }
.meta > span:first-child { white-space: nowrap; }
.meta .need { color: var(--accent); text-align: right; }
.meta .need svg { vertical-align: -1px; }
.note.need { color: var(--accent); }
.earn { display: grid; border-radius: 16px; background: var(--surface); padding: 2px 14px; margin-bottom: 8px; }
.earn-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.earn-row:last-child { border-bottom: none; }
.earn-row div { flex: 1; min-width: 0; }
.earn-row b { font-weight: 600; font-size: 14.5px; }
.earn-row small { display: block; color: var(--muted); font-size: 12.5px; }
.earn-row .pts { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dev { margin-top: 22px; border: 1px dashed rgba(248, 234, 219, .25); border-radius: 14px; padding: 12px 14px; background: rgba(18, 5, 2, .55); }
.dev summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.dev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.dev button { min-height: 42px; padding: 6px 8px; border-radius: 10px; border: none; background: var(--raised); font-size: 12.5px; font-weight: 600; cursor: pointer; line-height: 1.25; }
.dev button:disabled { opacity: .4; cursor: default; }
.dev-row { display: flex; gap: 8px; margin-top: 8px; }
.dev-row select { flex: 1; min-width: 0; height: 42px; border-radius: 10px; border: 2px solid var(--line); background: rgba(22, 7, 3, .8); padding: 0 8px; font-size: 13px; color-scheme: dark; }
.dev-row button { flex: none; padding: 0 14px; }
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: rgba(10, 3, 1, .72); backdrop-filter: blur(4px); animation: fade .2s ease; }
.overlay .box { width: 100%; max-width: 340px; text-align: center; border-radius: 26px; padding: 28px 22px 22px; background: var(--surface-solid); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 220, 180, .08); }
.overlay .badge { margin: 0 auto 12px; display: block; animation: pop .55s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { from { transform: scale(.4) rotate(-12deg); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* home (Phase 1) */
.top.gone { display: none; }
.home-head { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 16px; }
.hh-brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 19px; }
.brand-mark.sm { width: 32px; height: 32px; border-radius: 10px; }
button.avatar { cursor: pointer; padding: 0; font: inherit; font-weight: 700; }
.tagline { color: var(--muted); font-size: 14px; margin: 0 0 16px; text-wrap: pretty; }
.tagline b { color: var(--text); font-weight: 600; }
.path-card { display: flex; flex-direction: column; gap: 2px; width: 100%; margin-top: 12px; padding: 16px; border: 1px solid rgba(233, 176, 75, .35); border-radius: 20px; text-align: left; cursor: pointer;
  background: linear-gradient(160deg, rgba(233, 176, 75, .16), rgba(42, 15, 10, .9) 55%); box-shadow: 0 14px 34px -18px rgba(0, 0, 0, .85); }
.path-card .pc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.path-card > b { font-family: var(--display); font-size: 21px; font-weight: 800; }
.path-card .pc-cta { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; margin-top: 4px; font-weight: 700; color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 6px 14px; border: none; border-radius: 18px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13.5px;
  box-shadow: inset 0 1px 0 rgba(255, 220, 180, .06), 0 4px 14px -6px rgba(0, 0, 0, .5); transition: transform .1s, background .15s; }
.tile:active { transform: scale(.97); }
.tile:hover { background: var(--raised); }
.tile .ti { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; color: var(--accent); background: rgba(233, 176, 75, .13); }
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; border-radius: 22px; background: rgba(30, 10, 6, .92); box-shadow: 0 -6px 24px -10px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 220, 180, .06); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border: none; border-radius: 16px; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.tab.on { color: var(--accent); background: rgba(233, 176, 75, .12); }
.feat-hero { display: flex; flex-direction: column; align-items: flex-start; }
.feat-icon { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; color: var(--accent); background: rgba(233, 176, 75, .14); margin: 6px 0 16px; }
.feat-list { list-style: none; margin: 0; padding: 4px 14px; border-radius: 16px; background: var(--surface); }
.feat-list li { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.feat-list li:last-child { border-bottom: none; }
.feat-list li svg { color: var(--accent); flex: none; margin-top: 2px; }
.chord-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
.cs { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 12px; background: var(--surface); border: 2px solid transparent; }
.cs svg { width: 100%; max-width: 48px; color: var(--text); }
.cs b { font-family: var(--display); font-weight: 800; }
.cs.got { border-color: var(--good); }
.parts { list-style: none; margin: 0; padding: 4px 14px; border-radius: 16px; background: var(--surface); }
.parts li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.parts li:last-child { border-bottom: none; }
.parts li > div { flex: 1; min-width: 0; }
.parts b { font-weight: 600; display: block; }
.parts small { color: var(--muted); font-size: 12.5px; }
.pn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(233, 176, 75, .16); color: var(--accent); font-weight: 700; font-size: 13px; flex: none; }
.locked-step { display: flex; gap: 10px; align-items: center; padding: 14px; border-radius: 14px; border: 1px dashed rgba(248, 234, 219, .2); color: var(--muted); font-size: 14px; }
.path-actions { display: flex; flex-direction: column; gap: 4px; margin-top: 18px; }

/* tuner (Phase 2) */
.tu-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 6px; }
.chip-btn { display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px 8px 14px; border-radius: 99px; border: 1px solid rgba(233, 176, 75, .4); background: rgba(233, 176, 75, .12); color: var(--accent); font-weight: 700; font-size: 13.5px; cursor: pointer; }
.tu-gauge { margin: 4px -4px 0; }
.tgauge { width: 100%; height: auto; display: block; }
.tgauge .needle { stroke: var(--accent); transition: stroke .2s; }
.tgauge .hub { fill: var(--accent); transition: fill .2s; }
.tgauge.intune .needle { stroke: var(--good); }
.tgauge.intune .hub { fill: var(--good); }
.tu-read { text-align: center; margin-top: -6px; }
.tu-note { font-family: var(--display); font-size: 72px; font-weight: 800; line-height: 1; text-shadow: 0 4px 16px rgba(0, 0, 0, .5); }
.tu-note sup { font-size: 24px; color: var(--muted); margin-left: 2px; vertical-align: super; }
.tu-hint { margin: 8px 0 2px; font-weight: 700; font-size: 16px; min-height: 22px; }
.tu-hint.good { color: var(--good); }
.tu-hint.warn { color: var(--accent); }
.tu-freq { margin: 0; color: var(--muted); font-size: 12.5px; min-height: 18px; font-variant-numeric: tabular-nums; }
.tu-strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin: 18px 0 12px; }
.tstr { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1 / 1.15; border-radius: 16px; border: 2px solid transparent; background: var(--surface); cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
.tstr .tn { font-family: var(--display); font-size: 19px; font-weight: 800; }
.tstr small { font-size: 10px; color: var(--muted); }
.tstr .tchk { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%; display: none; place-items: center; background: var(--good); color: #173014; }
.tstr.done .tchk { display: grid; }
.tstr.sel { border-color: var(--accent); }
.tstr.active { background: var(--raised); box-shadow: 0 0 0 3px rgba(233, 176, 75, .35); transform: translateY(-2px); }
.tu-mode { margin-bottom: 10px; }
.tu-progress { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.tu-live { display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 4px; }
.tu-live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.tu-live .text-btn { display: inline-flex; align-items: center; gap: 5px; color: var(--text); }
.btn-alt { height: 48px; background: rgba(42, 15, 10, .9); color: var(--text); border: 1px solid rgba(248, 234, 219, .18); font-weight: 600; margin-bottom: 6px; }
.seg { display: flex; padding: 4px; gap: 4px; border-radius: 14px; background: var(--surface); }
.seg > * { flex: 1; text-align: center; padding: 9px 6px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg > .on { background: var(--accent); color: var(--on-accent); }
.sheet-wrap { place-items: end center; padding: 0; }
.sheet { width: 100%; max-width: 440px; max-height: 88vh; max-height: 88dvh; overflow-y: auto; border-radius: 26px 26px 0 0; background: var(--surface-solid);
  padding: 18px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, .9); animation: up .25s ease; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.sheet-head h2 { font-family: var(--display); font-size: 22px; font-weight: 800; margin: 0; }
.tlist { display: grid; gap: 8px; }
.topt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 14px; border: 2px solid transparent; background: rgba(62, 26, 16, .6); text-align: left; cursor: pointer; }
.topt .tt { flex: 1; min-width: 0; }
.topt b { display: block; font-weight: 600; }
.topt small { color: var(--muted); font-size: 12.5px; letter-spacing: .02em; }
.topt.on { border-color: var(--accent); }
.topt .tick { color: transparent; }
.topt.on .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tdel { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); }
.tdel:hover { background: rgba(255, 155, 133, .15); color: var(--danger); }
.tcustom { display: grid; gap: 6px; }
.tc-row { display: grid; grid-template-columns: 1fr 40px 64px 40px 66px; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 12px; background: rgba(62, 26, 16, .5); }
.tc-row.cal { grid-template-columns: 1fr 40px 80px 40px; }
.tc-l { font-size: 13px; color: var(--muted); }
.tc-row button { height: 36px; border-radius: 10px; border: none; background: var(--raised); font-size: 18px; font-weight: 700; cursor: pointer; }
.tc-row button:disabled { opacity: .35; cursor: default; }
.tc-row b { text-align: center; font-family: var(--display); font-size: 18px; font-weight: 800; }
.tc-row b.changed { color: var(--accent); }
.tc-row b sub { font-size: 11px; color: var(--muted); font-family: var(--body); }
.tc-row small { text-align: right; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }

/* Step 1 lesson (Phase 3) */
.lesson-top { display: flex; align-items: center; gap: 12px; margin: 2px 0 16px; }
.strings-wrap { border-radius: 16px; overflow: hidden; }
.strings-svg { width: 100%; height: auto; display: block; }
.strings-svg .glow { filter: drop-shadow(0 0 6px rgba(233, 176, 75, .8)); }
.fret-wrap { display: flex; justify-content: center; margin: 4px 0 12px; }
.fret-svg { width: 62%; max-width: 230px; height: auto; }
.fpulse { animation: fpulse 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes fpulse { 50% { transform: scale(1.12); } }
.finger-card { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 16px; background: var(--raised); border: 1px solid rgba(233, 176, 75, .3); }
.finger-card small { display: block; font-size: 12px; color: var(--muted); }
.finger-card b { font-size: 15.5px; font-weight: 600; line-height: 1.35; }
.fnum { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-family: var(--display); font-weight: 800; font-size: 22px; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn-ghost { width: auto; padding: 0 16px; flex: none; height: 56px; }
.btn-row .btn-primary { flex: 1; }
.listen { display: flex; flex-direction: column; gap: 10px; }
.lis-target { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface); }
.lis-target svg { width: 60px; flex: none; color: var(--text); }
.lis-target small { display: block; color: var(--muted); font-size: 12px; }
.lis-target b { display: block; font-family: var(--display); font-size: 22px; font-weight: 800; }
.meter-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.meter-row .rbar { flex: 1; height: 10px; margin: 0; }
.lis-heard { margin: 0; text-align: center; font-weight: 600; min-height: 22px; }
.lis-heard.good { color: var(--good); }
.lis-heard.warn { color: var(--accent); }
.success { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; margin-bottom: 12px; background: rgba(162, 217, 140, .14); border: 1px solid rgba(162, 217, 140, .4); }
.success > svg { color: var(--good); flex: none; }
.success b { display: block; }
.success span { font-size: 13px; color: var(--good); }
.check-row { display: flex; gap: 6px; margin-bottom: 14px; }
.check-row span { flex: 1; display: flex; align-items: center; justify-content: center; gap: 3px; padding: 8px 0; border-radius: 10px; background: var(--surface); font-family: var(--display); font-weight: 800; color: var(--muted); }
.check-row span.now { color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.check-row span.ok { color: #173014; background: var(--good); }
.done-hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 14px; }
.done-badge { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: var(--good); color: #173014; margin: 10px 0 16px; box-shadow: 0 0 0 10px rgba(162, 217, 140, .15); animation: pop .55s cubic-bezier(.2, 1.4, .4, 1) both; }
.qopts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.qopt { height: 52px; border-radius: 14px; border: 2px solid transparent; background: var(--surface); font-weight: 700; font-size: 15px; cursor: pointer; }
.qopt:disabled { cursor: default; opacity: .6; }
.qopt.right { opacity: 1; border-color: var(--good); background: rgba(162, 217, 140, .18); color: var(--good); }
.qopt.wrong { opacity: 1; border-color: var(--danger); background: rgba(255, 155, 133, .14); color: var(--danger); }
.qfeed { text-align: center; font-weight: 600; min-height: 22px; margin: 12px 0 0; }
.qfeed.good { color: var(--good); }
.qfeed.warn { color: var(--accent); }
.pstat { font-size: 12px; font-weight: 700; color: var(--good); white-space: nowrap; }
.pstat.due { color: var(--accent); }
.pn.ok { background: var(--good); color: #173014; }
button.task { width: 100%; border: none; text-align: left; cursor: pointer; }
.task .pts.due { color: var(--accent); }

/* scales (Phase 4) */
.why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.why-grid > div { display: flex; flex-direction: column; gap: 3px; padding: 12px; border-radius: 14px; background: var(--surface); }
.why-grid svg { color: var(--accent); margin-bottom: 4px; }
.why-grid b { font-size: 14px; }
.why-grid span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.scale-list { display: grid; gap: 8px; }
.scale-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px 10px 10px; border: none; border-radius: 16px; background: var(--surface); text-align: left; cursor: pointer; }
.scale-row:hover { background: var(--raised); }
.sr-key { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgba(233, 176, 75, .14); color: var(--accent); font-family: var(--display); font-weight: 800; font-size: 18px; }
.sr-t { flex: 1; min-width: 0; }
.sr-t b { display: block; font-weight: 600; }
.sr-t small { color: var(--muted); font-size: 12.5px; }
.scale-row .chev { color: var(--muted); }
.scale-row .pstat { display: inline-flex; align-items: center; gap: 3px; }
.scale-board { padding: 10px 6px 8px; border-radius: 16px; background: rgba(20, 6, 2, .6); margin-bottom: 12px; }
.scale-svg { width: 100%; height: auto; display: block; }
.info-list { display: grid; border-radius: 16px; background: var(--surface); padding: 2px 14px; }
.info-list > div { padding: 12px 0; border-bottom: 1px solid var(--line); }
.info-list > div:last-child { border-bottom: none; }
.info-list small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.info-list p { margin: 0; font-size: 14.5px; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .04em; font-weight: 600; }
.sp-status { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface); }
.sp-next small, .sp-runs small { display: block; font-size: 11.5px; color: var(--muted); }
.sp-next b { font-size: 15px; font-weight: 700; }
.sp-runs { text-align: right; flex: none; }
.sp-runs span { display: flex; gap: 5px; justify-content: flex-end; margin-bottom: 4px; }
.sp-runs i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(248, 234, 219, .3); }
.sp-runs i.on { background: var(--good); border-color: var(--good); }
.sp-msg { min-height: 20px; margin: 10px 0; text-align: center; font-weight: 600; font-size: 14px; color: var(--muted); }
.sp-msg.good { color: var(--good); }
.sp-msg.warn { color: var(--accent); }
.met { display: grid; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--surface); margin-bottom: 10px; }
.met-row { display: flex; align-items: center; gap: 10px; }
.met-l { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.met-l svg { color: var(--accent); }
.met-row > button:not(.switch) { width: 38px; height: 36px; border-radius: 10px; border: none; background: var(--raised); font-size: 18px; font-weight: 700; cursor: pointer; }
.met-row b { min-width: 74px; text-align: center; font-family: var(--display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.met-row b small { font-family: var(--body); font-size: 11px; color: var(--muted); font-weight: 600; }
.met input[type=range] { width: 100%; accent-color: var(--accent); }

/* tabs (Phase 5) */
.tab-box { overflow-x: auto; border-radius: 14px; background: rgba(20, 6, 2, .65); padding: 8px 6px; scrollbar-width: thin; scroll-behavior: smooth; }
.tab-svg { display: block; height: auto; max-width: none; }
.tab-hub { display: grid; gap: 8px; margin-top: 14px; }
.hub-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px 12px 12px; border: 1px solid rgba(233, 176, 75, .25); border-radius: 16px; background: var(--surface); text-align: left; cursor: pointer; }
.hub-row:hover { background: var(--raised); }
.hub-ic { width: 44px; height: 44px; flex: none; border-radius: 13px; display: grid; place-items: center; color: var(--accent); background: rgba(233, 176, 75, .14); }
.sr-key.lvl-easy { color: var(--good); background: rgba(162, 217, 140, .14); }
.sr-key.lvl-hard { color: var(--danger); background: rgba(255, 155, 133, .14); }
.tl-check { margin-top: 16px; padding: 14px; border-radius: 16px; background: var(--surface); }
.tl-check > b { display: block; margin-bottom: 10px; }
.tl-opts { display: grid; gap: 8px; }
.qopt.wide { height: auto; min-height: 48px; padding: 10px 14px; text-align: left; font-weight: 600; font-size: 14.5px; }
.sym-list { display: grid; gap: 8px; }
.sym { display: grid; grid-template-columns: 34px 1fr; gap: 4px 12px; align-items: start; padding: 10px 12px; border-radius: 14px; background: var(--surface); }
.sym-k { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(233, 176, 75, .16); color: var(--accent); font-family: ui-monospace, Menlo, monospace; font-weight: 800; font-size: 17px; }
.sym b { display: block; font-size: 14.5px; }
.sym span { font-size: 13px; color: var(--muted); }
.sym .tab-box { grid-column: 1 / -1; padding: 2px 4px; }

/* practice & tutorials (Phase 6) */
.pair-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.pair { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: none; border-radius: 16px; background: var(--surface); text-align: left; cursor: pointer; }
.pair:hover { background: var(--raised); }
.pair b { font-family: var(--display); font-size: 20px; font-weight: 800; }
.pair b span { color: var(--accent); font-size: 16px; }
.pair small { font-size: 12px; color: var(--muted); }
.search-bar { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; height: 48px; border-radius: 16px; background: rgba(22, 7, 3, .9); border: 2px solid var(--line); margin-bottom: 8px; }
.search-bar:focus-within { border-color: var(--accent); }
.search-bar > span { color: var(--muted); display: grid; }
.search-bar input { flex: 1; min-width: 0; height: 100%; border: none; background: none; font-size: 15.5px; outline: none; }
.search-bar input::placeholder { color: rgba(211, 174, 149, .6); }
.search-bar.big { height: 56px; margin-bottom: 4px; }
.sb-go { height: 42px; padding: 0 16px; border: none; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; cursor: pointer; }
.pc-pair { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 14px; }
.pc-chord { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 18px; border-radius: 18px; background: var(--surface); border: 2px solid transparent; transition: border-color .15s, transform .15s; }
.pc-chord svg { width: 72px; color: var(--text); }
.pc-chord b { font-family: var(--display); font-size: 24px; font-weight: 800; }
.pc-chord.on { border-color: var(--accent); transform: scale(1.05); }
.pc-arrow { font-size: 22px; color: var(--accent); }
.pc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.pc-stats > div { padding: 12px 14px; border-radius: 14px; background: var(--surface); text-align: center; }
.pc-stats small { display: block; font-size: 12px; color: var(--muted); }
.pc-stats b { font-family: var(--display); font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.chart { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.chart-step { flex: none; min-width: 52px; padding: 10px 8px; border-radius: 12px; background: var(--surface); text-align: center; border: 2px solid transparent; }
.chart-step b { display: block; font-family: var(--display); font-size: 18px; font-weight: 800; }
.chart-step small { font-size: 11px; color: var(--muted); }
.chart-step.on { border-color: var(--accent); background: var(--raised); }
.chart-step.done { background: rgba(162, 217, 140, .16); }
.chart-step.done b { color: var(--good); }
.ps-big { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 14px 0 4px; }
.ps-big svg { width: 110px; color: var(--text); }
.ps-big b { font-family: var(--display); font-size: 34px; font-weight: 800; }
.slots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 0 6px; border-radius: 12px; background: var(--surface); transition: background .06s; }
.slot .arrow { font-size: 24px; font-weight: 800; color: var(--accent); min-height: 30px; }
.slot small { font-size: 11px; color: var(--muted); font-weight: 700; }
.slot.rest { opacity: .55; }
.slot.now { background: var(--accent); }
.slot.now .arrow, .slot.now small { color: var(--on-accent); }
.tut-list { display: grid; gap: 8px; }
.tut-link { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; border-radius: 16px; background: var(--surface); color: var(--text); text-decoration: none; }
.tut-link:hover { background: var(--raised); }
.hub-ic.yt { color: #ff6b5e; background: rgba(255, 80, 64, .14); }
.chip.clear { background: none; border: 1px dashed var(--line); }

/* goals, skills test, graduation (Phase 7) */
.level-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: linear-gradient(160deg, rgba(233, 176, 75, .16), rgba(42, 15, 10, .9) 60%); border: 1px solid rgba(233, 176, 75, .3); }
.level-card > div { flex: 1; min-width: 0; }
.level-card small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.level-card b { display: block; font-family: var(--display); font-size: 22px; font-weight: 800; }
.level-card span { font-size: 12.5px; color: var(--muted); }
.btn.sm { width: auto; height: 42px; padding: 0 14px; font-size: 14px; flex: none; }
.danger-zone { display: grid; gap: 4px; padding: 6px; border-radius: 16px; border: 1px dashed rgba(255, 155, 133, .3); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: rgba(255, 155, 133, .15); }
.preview-flag { display: flex; align-items: center; gap: 6px; justify-content: center; padding: 8px; border-radius: 10px; background: rgba(233, 176, 75, .14); color: var(--accent); font-size: 13px; font-weight: 600; margin: 0 0 12px; }
.cert { padding: 8px; border-radius: 20px; background: linear-gradient(135deg, #e9b04b, #8a5a1c 50%, #e9b04b); box-shadow: 0 24px 50px -20px rgba(0, 0, 0, .9); }
.cert-in { padding: 22px 18px 20px; border-radius: 14px; text-align: center; background: radial-gradient(ellipse at 50% 0%, #fff6e6, #f2e3c8); color: #3a1a0c; border: 1.5px solid rgba(138, 90, 28, .55); }
.cert-in .badge { margin: 4px auto 6px; display: block; }
.cert-k { margin: 0; font-family: var(--display); font-weight: 800; letter-spacing: .2em; text-transform: uppercase; font-size: 12px; color: #8a5a1c; }
.cert-t { margin: 4px 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 24px; font-style: italic; }
.cert-s { margin: 4px 0; font-size: 14px; color: #5e3a20; }
.cert-name { margin: 2px 0; font-family: var(--display); font-size: 32px; font-weight: 800; border-bottom: 1.5px solid rgba(138, 90, 28, .5); display: inline-block; padding: 0 18px 2px; }
.cert-date { margin: 12px 0 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8a5a1c; }
.grad-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.grad-stats > div { padding: 10px 6px; border-radius: 14px; background: var(--surface); text-align: center; }
.grad-stats b { display: block; font-family: var(--display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.grad-stats small { font-size: 11.5px; color: var(--muted); }
.grad-h { font-family: var(--display); font-size: 22px; font-weight: 800; margin: 6px 0 6px; }

/* footer */
.foot { flex: none; padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.btn { height: 56px; border-radius: 16px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: opacity .15s, transform .1s; }
.btn:active:not(:disabled) { transform: scale(.985); }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 24px -10px rgba(233, 176, 75, .7); }
.btn-primary:disabled { opacity: .38; box-shadow: none; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); height: 48px; font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 10; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; max-width: calc(100% - 40px); text-align: center; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="wood" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>
<div class="shell"><main class="app" id="app"></main></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function () {
  'use strict';
  const KEY = 'hookline-profile-v1';

  /* ---------- icons ---------- */
  const ICONS = {
    pick: '<path d="M12 21c-3-3.5-7-9-7-13 0-3 3.5-4 7-4s7 1 7 4c0 4-4 9.5-7 13z"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    flame: '<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5.5 1 1 1.5 2 1.5 3 1.5-1.5 2-4.5 1.5-7.5z"/>',
    note: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
    seed: '<path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 5-3 7-8 7z"/><path d="M12 15c0-3-2.5-5-7-5 0 4 2.5 5 7 5z"/>',
    chords: '<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M5 8h14M5 13h14M9.7 3v18M14.3 3v18"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.5 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    guitar: '<path d="M20 4l-6.5 6.5"/><path d="M18.5 2.5l3 3"/><path d="M11 11.5a3.5 3.5 0 0 0-5 0c-.8.8-.6 1.8-1.6 2.3C3 14.5 2 16 3.5 18.5S7 22 9.5 21c.6-1.3 1.6-1 2.4-1.8a3.5 3.5 0 0 0 0-5"/><circle cx="8.5" cy="16" r="1.3"/>',
    bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    nylon: '<circle cx="12" cy="14" r="6"/><circle cx="12" cy="14" r="2"/><path d="M12 8V2"/>',
    cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11.5l2-8H6"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>',
    play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/>',
    unlock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
    refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
    tuner: '<path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4.5-6"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/><path d="M6 11.5l1 .8M12 8.5v1.2M18 11.5l-1 .8"/>',
    scales: '<path d="M4 20h4v-4h4v-4h4V8h4V4"/><circle cx="6" cy="20" r="0.5" fill="currentColor"/>',
    metronome: '<path d="M8.5 3h7L19 21H5z"/><path d="M12 15l5-9"/><path d="M7 17h10"/>',
    tabs: '<path d="M3 6h18M3 10h18M3 14h18M3 18h18"/><rect x="7" y="8" width="4" height="4" rx="1" fill="var(--surface-solid)"/><rect x="14" y="12" width="4" height="4" rx="1" fill="var(--surface-solid)"/>',
    video: '<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9v6l5-3z" fill="currentColor"/>',
    home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
    path: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/>',
    rank: '<path d="M12 2l8 3v6c0 5.5-3.5 9.5-8 11-4.5-1.5-8-5.5-8-11V5z"/><path d="M12 7l1.6 3.2 3.4.5-2.5 2.4.6 3.4-3.1-1.6-3.1 1.6.6-3.4L7 10.7l3.4-.5z"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    external: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6M9 11h6"/>',
    chevdown: '<path d="M6 9l6 6 6-6"/>',
    speaker: '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
    stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>'
  };
  const ic = (n, s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- chord diagrams (low E to high E) ---------- */
  const CH = { Em: [0,2,2,0,0,0], G: [3,2,0,0,0,3], C: ['x',3,2,0,1,0], D: ['x','x',0,2,3,2], Am: ['x',0,2,2,1,0],
    E: [0,2,2,1,0,0], A: ['x',0,2,2,2,0], Dm: ['x','x',0,2,3,1], F: [1,3,3,2,1,1], Bm: ['x',2,4,4,3,2] };
  const CHORD_ORDER = ['Em', 'G', 'C', 'D', 'Am', 'E', 'A', 'Dm', 'F'];
  const CHORD_NAMES = { Em: 'E minor', G: 'G major', C: 'C major', D: 'D major', Am: 'A minor', E: 'E major', A: 'A major', Dm: 'D minor', F: 'F major' };
  const UNLOCKS = { Em: 86, G: 214, C: 380, D: 290, Am: 175, E: 120, A: 140, Dm: 90, F: 160 };
  function chordSVG(fr) {
    let s = '<svg class="chord" viewBox="0 0 64 70" aria-hidden="true">';
    for (let i = 0; i < 6; i++) { const x = 8 + i * 9.6; s += `<line x1="${x}" y1="14" x2="${x}" y2="62" stroke="currentColor" stroke-opacity=".55"/>`; }
    for (let f = 0; f <= 4; f++) { const y = 14 + f * 12; s += `<line x1="8" y1="${y}" x2="56" y2="${y}" stroke="currentColor" stroke-opacity="${f ? .55 : 1}" stroke-width="${f ? 1 : 3}"/>`; }
    fr.forEach((v, i) => {
      const x = 8 + i * 9.6;
      if (v === 'x') s += `<path d="M${x - 3} 3l6 6M${x + 3} 3l-6 6" stroke="currentColor" stroke-opacity=".6" stroke-width="1.4" fill="none"/>`;
      else if (v === 0) s += `<circle cx="${x}" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/>`;
      else s += `<circle cx="${x}" cy="${14 + (v - 0.5) * 12}" r="4.2" fill="var(--accent)"/>`;
    });
    return s + '</svg>';
  }

  /* ---------- profile ---------- */
  const DEFAULT = { step: 'welcome', done: false, name: '', level: null, goals: [], chords: [], genres: [], guitar: null,
    minutes: 10, reminder: true, remindAt: '19:00', mic: null, email: '',
    points: 0, log: [], day: null, learned: [], songs: [],
    tuningId: 'standard', customTunings: [], a4: 440,
    step1: { stage: 'intro', chord: 0, finger: 0, sub: 'learn', quizDate: null, quizBest: 0, mastered: false, tuned: false, done: false, skipped: false, check: 0 },
    tabs: { step: 0, learned: false, done: [], quizBest: null },
    practice: { best: {}, goals: {}, strums: {} }, tutRecent: [], days: [], graduated: false, skillTest: null };
  const fresh = () => JSON.parse(JSON.stringify(DEFAULT));
  function load() {
    try { const p = JSON.parse(localStorage.getItem(KEY)); if (p && typeof p === 'object') return Object.assign(fresh(), p); } catch (e) {}
    return fresh();
  }
  let profile = load();
  profile.practice = Object.assign({ best: {}, goals: {}, strums: {} }, profile.practice);
  function save() { try { localStorage.setItem(KEY, JSON.stringify(profile)); } catch (e) {} }

  /* ---------- content ---------- */
  const LEVELS = [
    { v: 'new', icon: 'seed', t: 'Never played', s: 'Starting from zero' },
    { v: 'few', icon: 'chords', t: 'I know a few chords', s: 'But full songs still feel hard' },
    { v: 'some', icon: 'star', t: 'I can play some songs', s: 'I want to learn faster' }
  ];
  const GOALS = [
    { v: 'songs', icon: 'note', t: 'Play songs I love', s: 'Strum along to music I already listen to' },
    { v: 'campfire', icon: 'flame', t: 'Campfire classics', s: 'Sing-alongs everyone knows' },
    { v: 'write', icon: 'chords', t: 'Write my own songs', s: 'Learn chords that work together' },
    { v: 'friends', icon: 'users', t: 'Play with friends', s: 'Jam, busk or start a band' }
  ];
  const GENRES = ['Pop', 'Rock', 'Indie', 'Country', 'Folk', 'R&B', 'Hip-hop', 'Soul', 'Punk', 'Metal', 'Worship', 'Latin'];
  const GUITARS = [
    { v: 'acoustic', icon: 'guitar', t: 'Acoustic', s: 'Steel strings' },
    { v: 'electric', icon: 'bolt', t: 'Electric', s: 'Plugged into an amp or headphones' },
    { v: 'classical', icon: 'nylon', t: 'Classical', s: 'Nylon strings' },
    { v: 'none', icon: 'cart', t: "I don't have one yet", s: "We'll help you pick a first guitar" }
  ];
  const TIMES = [
    { v: 10, label: 'Quick', days: 3 },
    { v: 20, label: 'Steady', days: 2 },
    { v: 45, label: 'Serious', days: 1 }
  ];
  if (!TIMES.some(t => t.v === profile.minutes)) { profile.minutes = 10; save(); }
  profile.goals = profile.goals.filter(g => GOALS.some(x => x.v === g));   // drop goals that no longer exist
  const etaText = t => `At ${t.v} minutes a day, you'll play your first two-chord song ${t.days === 1 ? '<b>on day one</b>' : `in about <b>${t.days} days</b>`}.`;

  /* ---------- steps ---------- */
  const ORDER = ['welcome', 'name', 'level', 'goal', 'chords', 'genres', 'guitar', 'time', 'mic', 'account', 'ready'];
  const flow = () => ORDER.filter(s => !(s === 'chords' && profile.level === 'new'));

  const optCard = (group, o, pressed) => `<button class="opt" data-pick="${group}" data-v="${o.v}" aria-pressed="${pressed}">
      <span class="oi">${ic(o.icon)}</span><span class="ot"><b>${esc(o.t)}</b><small>${esc(o.s)}</small></span><span class="tick">${ic('check', 14)}</span></button>`;

  const STEPS = {
    welcome: {
      bare: true,
      body: () => `<div class="welcome">
        <div class="brand"><span class="brand-mark">${ic('pick', 24)}</span><span>Hookline</span></div>
        <h1 class="title">Learn guitar the quick, free and easy way.</h1>
        <p class="lead">Short daily lessons, a built-in tuner and feedback while you play. Start with your first two chords today.</p>
        <div class="hero-card" aria-label="Lesson 1: E minor and G">
          <div class="hero-top"><span class="pill">${ic('play', 14)} Lesson 1</span><span class="note" style="margin:0">10 min</span></div>
          <div class="hero-chords"><div class="hc">${chordSVG(CH.Em)}<b>Em</b></div><span class="arrow">${ic('arrow', 26)}</span><div class="hc">${chordSVG(CH.G)}<b>G</b></div></div>
          <div class="hero-meta"><span>Your first 2 chords</span><span>Strum: down, down, up</span></div>
        </div>
        <ul class="values">
          <li>${ic('bolt')}<div><b>Quick</b><span>Lessons fit in 10 minutes a day</span></div></li>
          <li>${ic('star')}<div><b>Free</b><span>Lessons and the tuner cost nothing</span></div></li>
          <li>${ic('check')}<div><b>Easy</b><span>One small step at a time, with feedback as you play</span></div></li>
        </ul></div>`,
      foot: () => `<button class="btn btn-primary" data-act="next">Get started</button><button class="btn btn-ghost" data-act="login">I already have an account</button>`
    },
    name: {
      body: () => `<p class="eyebrow">About you</p><h1 class="title">What should we call you?</h1>
        <p class="lead">This is how you'll show up in the app.</p>
        <div class="field"><label for="name">First name</label><input class="input" id="name" autocomplete="given-name" maxlength="24" placeholder="Your name" value="${esc(profile.name)}"></div>`,
      valid: () => profile.name.trim().length > 0,
      mount: () => { const el = document.getElementById('name'); el.addEventListener('input', () => { profile.name = el.value; save(); syncFoot(); }); setTimeout(() => el.focus(), 350); }
    },
    level: {
      body: () => `<p class="eyebrow">Experience</p><h1 class="title">How much have you played, ${esc(firstName())}?</h1>
        <p class="lead">Be honest. We'll start you at the right spot.</p>
        <div class="options" data-group="level">${LEVELS.map(o => optCard('level', o, profile.level === o.v)).join('')}</div>`,
      valid: () => !!profile.level
    },
    goal: {
      body: () => `<p class="eyebrow">Your goal</p><h1 class="title">What do you want guitar for?</h1>
        <p class="lead">Pick as many as you like. Your plan is built around these.</p>
        <div class="options" data-group="goals" data-multi>${GOALS.map(o => optCard('goals', o, profile.goals.includes(o.v))).join('')}</div>`,
      valid: () => profile.goals.length > 0
    },
    chords: {
      body: () => `<p class="eyebrow">What you know</p><h1 class="title">Which chords can you already play?</h1>
        <p class="lead">Tap every chord you can play cleanly. We'll double-check with the mic later.</p>
        <div class="chord-grid" data-group="chords" data-multi>${CHORD_ORDER.map(c => `<button class="chord-card" data-pick="chords" data-v="${c}" aria-pressed="${profile.chords.includes(c)}" aria-label="${CHORD_NAMES[c]}"><span class="tick">${ic('check', 12)}</span>${chordSVG(CH[c])}<b>${c}</b></button>`).join('')}</div>
        <p class="note">Not sure about one? Leave it off.</p>`,
      valid: () => true,
      nextLabel: () => profile.chords.length ? `Continue with ${profile.chords.length} chord${profile.chords.length > 1 ? 's' : ''}` : 'None of these yet'
    },
    genres: {
      body: () => `<p class="eyebrow">Your taste</p><h1 class="title">What do you listen to?</h1>
        <p class="lead">Pick at least one. We'll use songs you'll enjoy for practice.</p>
        <div class="chips" data-group="genres" data-multi>${GENRES.map(g => `<button class="chip" data-pick="genres" data-v="${esc(g)}" aria-pressed="${profile.genres.includes(g)}">${esc(g)}</button>`).join('')}</div>`,
      valid: () => profile.genres.length > 0
    },
    guitar: {
      body: () => `<p class="eyebrow">Your guitar</p><h1 class="title">What will you play on?</h1>
        <p class="lead">We'll tune lessons and tips to it.</p>
        <div class="options" data-group="guitar">${GUITARS.map(o => optCard('guitar', o, profile.guitar === o.v)).join('')}</div>`,
      valid: () => !!profile.guitar
    },
    time: {
      body: () => { const t = TIMES.find(x => x.v === profile.minutes) || TIMES[0];
        return `<p class="eyebrow">Practice</p><h1 class="title">How much time a day?</h1>
        <p class="lead">Choose a practice time that you will stay consistent with. 10 minutes a day for a week is better than 45 minutes twice a week.</p>
        <div class="times" data-group="minutes">${TIMES.map(x => `<button class="time" data-pick="minutes" data-v="${x.v}" aria-pressed="${profile.minutes === x.v}"><b>${x.v}</b><span>min / day</span><small>${x.label}</small></button>`).join('')}</div>
        <div class="callout">${ic('target')}<span id="eta">${etaText(t)}</span></div>
        <div class="callout"><span style="display:flex;gap:12px;align-items:center;flex:1">${ic('bell')}<span>Daily reminder</span></span>
          <input type="time" class="time-input" id="remindAt" value="${esc(profile.remindAt)}" aria-label="Reminder time"${profile.reminder ? '' : ' disabled'}>
          <button class="switch" id="reminder" role="switch" aria-checked="${profile.reminder}" aria-label="Daily reminder"></button></div>
        <p class="note">You can change this any time.</p>`; },
      valid: () => true,
      mount: () => {
        const sw = document.getElementById('reminder'), at = document.getElementById('remindAt');
        sw.addEventListener('click', () => { profile.reminder = !profile.reminder; sw.setAttribute('aria-checked', profile.reminder); at.disabled = !profile.reminder; save(); });
        at.addEventListener('change', () => { profile.remindAt = at.value; save(); });
      }
    },
    mic: {
      body: () => `<p class="eyebrow">Microphone</p><h1 class="title">Let Hookline hear you play</h1>
        <p class="lead">The tuner and practice feedback listen through your mic, so we can tell you when a string is flat or a chord change is late.</p>
        <div class="mic-hero" id="micHero">${ic('mic', 56)}</div>
        <div class="meter" id="meter" aria-hidden="true">${'<i></i>'.repeat(14)}</div>
        <p class="status" id="micStatus">${profile.mic === 'granted' ? 'Mic is on.' : ''}</p>
        <div class="privacy">${ic('shield', 18)}<span>Sound is processed on your phone while you practice. Nothing is recorded or uploaded.</span></div>`,
      foot: () => profile.mic === 'granted'

    account: {

    ready: {

        return `<p class="eyebrow">You're all set</p><h1 class="title">Here's your plan, ${esc(firstName())}</h1>
        <p class="lead">Built from your answers. It adjusts as you play.</p>
        <div class="plan-card">

        </div>

    },
    home: {
